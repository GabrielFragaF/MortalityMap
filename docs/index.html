<!DOCTYPE html>
<html lang="en">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230ea5e9'/%3E%3C/svg%3E">

<style>
:root{--bg:#0b1220;--panel:#fff;--panel-weak:#f8fafc;--text:#0f172a;--muted:#64748b;--ring:#93c5fd;--shadow:0 10px 30px rgba(2,6,23,.25)}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,"Helvetica Neue",Arial}
#map{position:absolute;inset:0}

/* Panel */
#panel{position:absolute;top:14px;left:14px;z-index:1000;width:360px;max-height:90vh;overflow:auto;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);border:1px solid #e2e8f0}
#panel.collapsed{height:46px;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #e2e8f0;background:var(--panel-weak)}
.topbar h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.2px}
.iconbtn{background:#f1f5f9;border:1px solid #e2e8f0;color:#0f172a;border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:600}
.iconbtn:hover{filter:brightness(0.98)}
.section{padding:10px 14px}
.row{margin-bottom:10px}
label{display:block;font-weight:700;margin:6px 0;font-size:13px}
select{width:100%;padding:8px 10px;border:1px solid #e2e8f0;border-radius:10px;background:#fff}
select:focus{border-color:var(--ring);box-shadow:0 0 0 3px rgba(59,130,246,.25)}
details{border:1px solid #e2e8f0;border-radius:12px;background:#fff}
details+details{margin-top:10px}
summary{list-style:none;cursor:pointer;padding:10px 12px;font-weight:800;background:#f8fafc;border-radius:12px}
summary::-webkit-details-marker{display:none}
details .content{padding:10px 12px}
.controls-footer{display:flex;gap:10px;justify-content:space-between;margin-top:6px}
#resetBtn,#applyBtn{flex:1;background:#0ea5e9;border:none;color:#fff;border-radius:10px;padding:10px 12px;font-weight:800;cursor:pointer}
#resetBtn{background:#e11d48}
.help{font-size:12px;color:var(--muted);margin-top:4px}

/* Legend bottom-right */
#legend{position:absolute;bottom:18px;right:14px;z-index:1000;background:#fff;border-radius:12px;box-shadow:var(--shadow);border:1px solid #e2e8f0;padding:10px 12px;font-size:13px;min-width:240px}
.leghdr{font-weight:800;margin-bottom:8px}
.legend-row{display:flex;align-items:center;margin:4px 0}
.swatch{width:26px;height:12px;border-radius:3px;border:1px solid #94a3b8;margin-right:8px}

/* Spinner + toast */
#spinner{position:absolute;top:14px;right:14px;z-index:1000;display:none;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);font-size:13px}
#toast{position:absolute;top:60px;right:14px;z-index:1000;display:none;background:#fee2e2;color:#991b1b;border:1px solid #fecaca;border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);font-size:13px;max-width:340px}

.leaflet-popup-content{margin:8px 12px}.kv{display:flex;justify-content:space-between;gap:10px}.kv b{color:#0f172a}small.muted{color:#64748b}
</style>

<body>

<div id="panel">

<script>
/* ========= Decoder shim (works with any UMD/browserified build) ========= */
(function ensureDecoders(){
  var VT = (window.VectorTile)
        || (window.vectorTile && window.vectorTile.VectorTile)
        || (window.mapbox_vector_tile && window.mapbox_vector_tile.VectorTile)
        || null;

  var PBF = (window.Pbf)
         || (window.pbf && window.pbf.Pbf)
         || null;

  if (!window.VectorTile && VT) window.VectorTile = VT;
  if (!window.Pbf && PBF) window.Pbf = PBF;

  window.__VT__ = VT || window.VectorTile || null;
  window.__PBF__ = PBF || window.Pbf || null;

  if (!window.__VT__ || !window.__PBF__) {
    console.warn('Decoder globals missing:',
      (!window.__VT__?'vector-tile.js ':'') + (!window.__PBF__?'pbf.js':'')
    );
  }
})();

/* ===== Map ===== */
const map = L.map('map',{zoomSnap:0.25,worldCopyJump:true}).setView([-24,-45],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors'}).addTo(map);

/* ===== UI helpers ===== */
const $ = id => document.getElementById(id);
const spinner=$('spinner'), toast=$('toast');
const showSpinner = (m='Loading…') => { spinner.textContent=m; spinner.style.display='block'; };
const hideSpinner = () => { spinner.style.display='none'; };
const showToast=(m,ms=4500)=>{ toast.textContent=m; toast.style.display='block'; setTimeout(()=>toast.style.display='none',ms); };
$('collapseBtn').addEventListener('click',()=>$('panel').classList.toggle('collapsed'));
window.addEventListener('error',()=>hideSpinner());
window.addEventListener('unhandledrejection',()=>hideSpinner());

/* keep (All) option sane in multiselects */
function enforceAllOption(e){
  const sel=e.target; if(!sel.multiple) return;
  const all = Array.from(sel.options).find(o=>o.value==='__ALL__');
  const chosen = Array.from(sel.selectedOptions).map(o=>o.value);
  if(chosen.length===0){ all.selected=true; }
  else if(chosen.includes('__ALL__') && chosen.length>1){
    Array.from(sel.options).forEach(o=>o.selected=false); all.selected=true;
  }else if(!chosen.includes('__ALL__') && all.selected){ all.selected=false; }
}
document.querySelectorAll('#panel select[multiple]').forEach(s=>s.addEventListener('change',enforceAllOption));

const getMulti = id => {
  const vals = Array.from($(id).selectedOptions||[]).map(o=>o.value);
  return (vals.length===0 || vals.includes('__ALL__')) ? [] : vals;
};
const clearAllSelects = ()=>{
  document.querySelectorAll('#panel select').forEach(s=>{
    if(s.multiple){
      Array.from(s.options).forEach(o=>o.selected=false);
      const all = Array.from(s.options).find(o=>o.value==='__ALL__'); if(all) all.selected=true;
    }else s.selectedIndex=0;
  });
};
const nf=(v)=>{
  if(v===0) return '0';
  const abs=Math.abs(v);
  const digits=abs<1?4:abs<10?3:2;
  return new Intl.NumberFormat(undefined,{maximumFractionDigits:digits}).format(v);
};

/* ===== Color ramps ===== */
const ramps={
  'Caretta caretta':['#feedde','#fdbe85','#fd8d3c','#e6550d','#a63603'],
  'Chelonia mydas':['#edf8e9','#bae4b3','#74c476','#31a354','#006d2c'],
  'Dermochelys coriacea':['#eff3ff','#bdd7e7','#6baed6','#3182bd','#08519c'],
  'Eretmochelys imbricata':['#f2f0f7','#cbc9e2','#9e9ac8','#756bb1','#54278f'],
  'Lepidochelys olivacea':['#f7fcf5','#d9f0d3','#a6dba0','#5aae61','#1b7837'],
  'multi':['#fee5d9','#fcae91','#fb6a4a','#de2d26','#a50f15']
};
let jenksBreaks=[0,1,2,3,4,5];
let activeRamp=ramps['multi'];

/* Solid defensive legend */
function updateLegend(localBreaks, localRamp){
  const el=$('legend');
  const ramp = (Array.isArray(localRamp) && localRamp.length) ? localRamp.slice() : ramps['multi'].slice();
  const brks = (Array.isArray(localBreaks) && localBreaks.length>1) ? localBreaks.slice() : [0,1,2,3,4,5];

  const spSel=getMulti('speciesFilter');
  const name=(spSel.length===1)?spSel[0]:(spSel.length>1?'Multiple species':'All species');
  el.innerHTML=`<div class="leghdr">${name}</div>`;

  const n = Math.min(ramp.length, brks.length-1);
  if (n <= 0) {
    el.insertAdjacentHTML('beforeend', `<div class="legend-row"><span>No data in view</span></div>`);
    return;
  }
  for(let i=0;i<n;i++){
    const a=brks[i], b=brks[i+1];
    const title=`${nf(a)} – ${nf(b)}`;
    el.insertAdjacentHTML('beforeend',
      `<div class="legend-row" title="${title}"><span class="swatch" style="background:${ramp[i]}"></span><span>${title}</span></div>`
    );
  }
}
const currentRamp=()=>{
  const sp=getMulti('speciesFilter');
  return (sp.length===1 && ramps[sp[0]]) ? ramps[sp[0]] : ramps['multi'];
};

/* ===== Canonicalization ===== */
const canon = {
  season: v=>{
    const s=(v??'').toString().toLowerCase().trim();
    if(!s) return '';
    if(['outono','autumn'].includes(s)) return 'Autumn';
    if(['primavera','spring'].includes(s)) return 'Spring';
    if(['verao','verão','summer'].includes(s)) return 'Summer';
    if(['inverno','winter'].includes(s)) return 'Winter';
    return 'Unknown';
  },
  sex: v=>{
    const s=(v??'').toString().toLowerCase().trim();
    if(['fêmea','femea','female','f'].includes(s)) return 'Female';
    if(['macho','male','m'].includes(s)) return 'Male';
    return 'Unknown';
  },
  stage: v=>{
    const s=(v??'').toString().toLowerCase().trim();
    if(['adulto','adult'].includes(s)) return 'Adult';
    if(['juvenil','juvenile'].includes(s)) return 'Juvenile';
    if(['filhote','hatchling'].includes(s)) return 'Hatchling';
    return 'Unknown';
  },
  year: v=>{
    if(v==null) return '';
    const n = parseInt(String(v).replace(/\.0$/,''),10);
    return Number.isFinite(n) ? String(n) : '';
  }
};
const norm=v=>(v==null?'':String(v)).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const asIntString=v=>{ const n=parseInt(v,10); return Number.isFinite(n)?String(n):String(v); };

/* Build predicate using canonical forms */
function makePredicate(){
  const sel={
    species:new Set(getMulti('speciesFilter').map(v=>v)),
    development_stage:new Set(getMulti('stageFilter').map(v=>v)),
    sex:new Set(getMulti('sexFilter').map(v=>v)),
    Fishing:new Set(getMulti('FishingFilter').map(v=>v)),
    Marine_Debris:new Set(getMulti('Marine_DebrisFilter').map(v=>v)),
    Agression:new Set(getMulti('AgressionFilter').map(v=>v)),
    Boat_collision:new Set(getMulti('Boat_collisionFilter').map(v=>v)),
    Dredging:new Set(getMulti('DredgingFilter').map(v=>v)),
    Oil:new Set(getMulti('OilFilter').map(v=>v)),
    Petrol:new Set(getMulti('PetrolFilter').map(v=>v)),
    decomposition_code:new Set(getMulti('decompFilter').map(v=>v)),
    season:new Set(getMulti('seasonFilter').map(v=>v)),
    year:new Set(getMulti('yearFilter').map(v=>v)),
    month:new Set(getMulti('monthFilter').map(v=>v))
  };

  const test=(k,raw)=>{
    const set=sel[k];
    if(!set.size) return true;

    let pv = raw;
    if(k==='season') pv = canon.season(raw);
    else if(k==='sex') pv = canon.sex(raw);
    else if(k==='development_stage') pv = canon.stage(raw);
    else if(k==='year') pv = canon.year(raw);
    else if(k==='month' || k==='decomposition_code') pv = asIntString(raw);

    if(set.has(pv)) return true;
    if(k==='year'||k==='month'||k==='decomposition_code'){
      return set.has(asIntString(raw)) || set.has(asIntString(pv));
    }
    return false;
  };

  return p=>(
    test('species',p.species)&&test('development_stage',p.development_stage)&&test('sex',p.sex)&&
    test('Fishing',p.Fishing)&&test('Marine_Debris',p.Marine_Debris)&&test('Agression',p.Agression)&&
    test('Boat_collision',p.Boat_collision)&&test('Dredging',p.Dredging)&&test('Oil',p.Oil)&&
    test('Petrol',p.Petrol)&&test('decomposition_code',p.decomposition_code)&&
    test('season',p.season)&&test('year',p.year)&&test('month',p.month)
  );
}

/* ===== pmtiles:// fetch shim + PM cache ===== */
const origFetch = window.fetch.bind(window);
const pmCache = new Map();
async function getPM(archive){
  const u = new URL(archive, new URL('.', location.href)).toString();
  if(pmCache.has(u)) return pmCache.get(u);
  const inst = new pmtiles.PMTiles(u); // v4 API
  pmCache.set(u, inst);
  return inst;
}
window.fetch = async (input, init) => {
  if (typeof input === 'string' && input.startsWith('pmtiles://')) {
    const m = input.match(/^pmtiles:\/\/(.+?)\/(\d+)\/(\d+)\/(\d+)\.pbf$/);
    if (!m) return Promise.reject(new Error('Bad pmtiles URL'));
    const [_, archive, z, x, y] = m;
    try{
      const pm = await getPM(archive);
      const t  = await pm.getZxy(+z,+x,+y);
      if(!t || !t.data){ return new Response(null,{status:204}); }
      return new Response(t.data);
    }catch(e){
      console.warn('Tile fetch failed for', archive, z, x, y, e);
      return new Response(null,{status:204});
    }
  }
  return origFetch(input, init);
};

/* ===== Helpers ===== */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function lon2tile(lon,z){return Math.floor((lon+180)/360*Math.pow(2,z));}
function lat2tile(lat,z){const r=lat*Math.PI/180;return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*Math.pow(2,z));}
function tileRangeForBounds(b,z){
  const nw=b.getNorthWest(), se=b.getSouthEast();
  let minX=lon2tile(nw.lng,z), maxX=lon2tile(se.lng,z);
  let minY=lat2tile(nw.lat,z), maxY=lat2tile(se.lat,z);
  if(maxX<minX)[minX,maxX]=[maxX,minX]; if(maxY<minY)[maxY,minY]=[minY,maxY];
  const n=Math.pow(2,z); minY=Math.max(0,Math.min(n-1,minY)); maxY=Math.max(0,Math.min(n-1,maxY));
  return {minX,maxX,minY,maxY};
}
const wrapX=(x,z)=>{const n=Math.pow(2,z);return((x%n)+n)%n;};
function fileFor(res, ct){
  // cache-buster to avoid Chrome "ERR_CACHE_OPERATION_NOT_SUPPORTED"
  const v='v=20250812';
  return `hexgrid_${res}_${ct}.pmtiles?${v}`;
}

/* ===== State ===== */
let vtLayer=null, layerName='', header=null;
const aggByHex = new Map();  // h3_index -> {sum, uidCount, counts:{...}}
let metricField = 'sum_val';

/* ===== Detect layer name safely ===== */
async function detectLayerName(pmFile){
  try{
    const pm = await getPM(pmFile);
    header = await pm.getHeader();
    const md = await pm.getMetadata();
    if (md && md.json){
      const j = (typeof md.json==='string') ? JSON.parse(md.json) : md.json;
      if (j && j.vector_layers){
        if (Array.isArray(j.vector_layers) && j.vector_layers.length) return j.vector_layers[0].id || 'hexgrid';
        const keys = Object.keys(j.vector_layers); if(keys.length) return keys[0];
      }
    }
    if(!window.__VT__ || !window.__PBF__) throw new Error('VectorTile/Pbf globals not available to probe tiles.');
    const z = clamp(Math.floor(map.getZoom()), header.minZoom, header.maxZoom);
    const {minX,maxX,minY,maxY}=tileRangeForBounds(map.getBounds(), z);
    for(let x=minX;x<=maxX;x++){
      for(let y=minY;y<=maxY;y++){
        const r = await (await getPM(pmFile)).getZxy(z, wrapX(x,z), y);
        if(!r || !r.data) continue;
        const vt = new window.__VT__(new window.__PBF__(r.data));
        const names = Object.keys(vt.layers||{}); if(names.length) return names[0];
      }
    }
  }catch(e){ console.warn('Layer detect failed:', e); }
  console.warn('Falling back to "hexgrid"');
  return 'hexgrid';
}

/* ===== Aggregation + breaks (robust) ===== */
const JENKS_CLASSES = 5;
const MIN_SAMPLES_JENKS = 20;
const MIN_DISTINCT = 3;
const EXACT_MAX = 2000;
const SAMPLE_TARGET = 1000;
const MAX_TILES_STATS = 90;
const MAX_HEXES_STATS  = 1800;
const EPS = 1e-9;

function expandIfFlat(min, max) {
  if (!isFinite(min) || !isFinite(max)) return [0,1,2,3,4,5];
  if (min === max) {
    const bump = min === 0 ? 1 : Math.max(Math.abs(min) * 0.1, 1e-6);
    return [min - 2*bump, min - bump, min, min + bump, min + 2*bump, min + 3*bump];
  }
  return null;
}

// ALWAYS returns monotonic edges if at least one finite value; null only when no data
function computeSafeBreaks(values) {
  if (!Array.isArray(values) || !values.length) return null;
  const sorted = values.filter(Number.isFinite).sort((a,b)=>a-b);
  if (!sorted.length) return null;

  const min = sorted[0], max = sorted[sorted.length-1];
  const flat = expandIfFlat(min, max);
  if (flat) return flat;

  let edges;
  if (sorted.length < MIN_SAMPLES_JENKS || (new Set(sorted.map(v=>+v.toFixed(6)))).size < MIN_DISTINCT) {
    edges = ss.quantileSorted(sorted, [0,0.2,0.4,0.6,0.8,1]);
  } else {
    try {
      edges = ss.jenks(sorted, JENKS_CLASSES);
      const unique = new Set(edges.map(v=>+v.toFixed(10)));
      if (unique.size < JENKS_CLASSES + 1) {
        edges = ss.quantileSorted(sorted, [0,0.2,0.4,0.6,0.8,1]);
      }
    } catch {
      edges = ss.quantileSorted(sorted, [0,0.2,0.4,0.6,0.8,1]);
    }
  }
  for (let i=1;i<edges.length;i++){
    if (edges[i] <= edges[i-1]) edges[i] = edges[i-1] + EPS;
  }
  return edges;
}

function reservoirSample(values, k){
  const out=[];
  for(let i=0;i<values.length;i++){
    if(i<k) out[i]=values[i];
    else{
      const j = Math.floor(Math.random()*(i+1));
      if(j<k) out[j]=values[i];
    }
  }
  return out;
}

const metricCandidatesByCT = {
  // prefer sum_val when present (PMTiles often use that)
  weight: ['sum_val','weight'],
  new_weight: ['sum_val','new_weight'],
  new_mortality_est_bf_mean: ['sum_val','new_mortality_est_bf_mean'],
  new_mortality_est_bf_low:  ['sum_val','new_mortality_est_bf_low'],
  new_mortality_est_bf_high: ['sum_val','new_mortality_est_bf_high']
};
function discoverMetricField(sampleProps, ct){
  if (Number.isFinite(Number(sampleProps?.sum_val))) return 'sum_val';
  const cands = metricCandidatesByCT[ct] || [];
  for(const k of cands){ if(Number.isFinite(Number(sampleProps?.[k]))) return k; }
  for(const k of Object.keys(sampleProps||{})){ if(Number.isFinite(Number(sampleProps[k]))) return k; }
  return 'sum_val';
}

// helper: best-effort unique-id count field detection per cell
function getUidCountFromProps(p){
  const keys = ['uid_count','unique_ids','unique_turtle_ids','unique_id_count','turtle_id_count','uidCount'];
  for(const k of keys){
    const n = Number(p[k]);
    if (Number.isFinite(n)) return n;
  }
  // fallback to 'count'
  const c = Number(p.count);
  if (Number.isFinite(c)) return c;
  return null; // final fallback will be row count (1 per feature)
}

// helpers to extract category counts from properties if present
function pickCounts(props, candidates){
  for(const group of candidates){
    let sum=0, have=false;
    for(const [label, keyList] of Object.entries(group)){
      const arr = Array.isArray(keyList)?keyList:[keyList];
      for(const k of arr){
        if (k in props) {
          sum += Number(props[k])||0; have=true;
        }
      }
    }
    if(have) return Object.fromEntries(Object.entries(group).map(([label, keys])=>{
      const arr = Array.isArray(keys)?keys:[keys];
      let v=0; for(const k of arr){ v += Number(props[k])||0; }
      return [label, v];
    }));
  }
  return null;
}
function pctParts(countMap){
  if(!countMap) return {parts:[], unknownCount:0, totalLabelled:0};
  const unknown = Number(countMap.Unknown||0);
  const labelled = Object.entries(countMap).filter(([k])=>k!=='Unknown');
  const totalLabelled = labelled.reduce((s,[,v])=>s+(Number(v)||0),0);
  const pct = v => totalLabelled ? (100 * (Number(v)||0) / totalLabelled) : 0;
  return { parts: labelled.map(([k,v])=>[k, pct(v)]), unknownCount: unknown, totalLabelled };
}

async function aggregateAndCollect(pmFile, layerName, predicate, ct){
  if(!window.__VT__ || !window.__PBF__){
    showToast('vector-tile.js / pbf.js not loaded — cannot compute breaks. Verify docs/vendor files.');
    return [];
  }
  aggByHex.clear();
  const pm = await getPM(pmFile);
  const hdr = header || await pm.getHeader();

  const zView = Math.min(Math.max(6, hdr.minZoom), hdr.maxZoom);
  const {minX,maxX,minY,maxY} = tileRangeForBounds(map.getBounds(), zView);

  const tilesX=maxX-minX+1, tilesY=maxY-minY+1;
  const totalTiles = tilesX*tilesY;
  let stride=1;
  if(totalTiles > MAX_TILES_STATS){
    const factor=Math.ceil(Math.sqrt(totalTiles / MAX_TILES_STATS));
    stride=Math.max(1,factor);
  } else {
    stride=1; // never decimate small grids
  }

  let discovered=false;
  const jobs=[];
  outer:
  for(let x=minX;x<=maxX;x+=stride){
    for(let y=minY;y<=maxY;y+=stride){
      jobs.push(pm.getZxy(zView, wrapX(x,zView), y).then(resp=>{
        if(!resp || !resp.data) return;
        const vt = new window.__VT__(new window.__PBF__(resp.data));
        const lyr = vt.layers[layerName]; if(!lyr) return;
        for(let i=0;i<lyr.length;i++){
          const feat = lyr.feature(i);
          const props = feat.properties||{};
          if(!predicate(props)) continue;

          if(!discovered){ metricField=discoverMetricField(props, ct); discovered=true; }

          const key = props.h3_index ?? props.h3 ?? props.id;
          if(!key) continue;

          const val = Number(props[metricField]);
          const uid = getUidCountFromProps(props);
          const entry = aggByHex.get(key) || {
            sum:0, uidCount:0,
            sexCounts:null, stageCounts:null, seasonCounts:null,
            yearCounts: Object.create(null),
            monthCounts: Object.create(null),
            species: props.species || null
          };

          if(Number.isFinite(val)) entry.sum += val;
          if(uid != null && Number.isFinite(uid)) entry.uidCount += uid;
          else entry.uidCount += 1; // row-count fallback if no unique-id field exists

          // Try to read categorical count fields if present on cell
          entry.sexCounts   ||= pickCounts(props, [{Female:'sex_female', Male:'sex_male', Unknown:'sex_unknown'}]);
          entry.stageCounts ||= pickCounts(props, [{Adult:'stage_adult', Juvenile:'stage_juvenile', Hatchling:'stage_hatchling', Unknown:'stage_unknown'}]);
          entry.seasonCounts||= pickCounts(props, [{Autumn:'season_autumn', Spring:'season_spring', Summer:'season_summer', Winter:'season_winter', Unknown:'season_unknown'}]);

          // Year/month mode (counts); if we only have a scalar 'year'/'month' on the cell, count it
          if (props.year != null) {
            const y = canon.year(props.year);
            if (y) entry.yearCounts[y] = (entry.yearCounts[y]||0)+1;
          }
          if (props.month != null) {
            const m = asIntString(props.month);
            if (m) entry.monthCounts[m] = (entry.monthCounts[m]||0)+1;
          }

          aggByHex.set(key, entry);
        }
      }).catch(e=>console.warn('tile decode skipped',e)));
      if(aggByHex.size > MAX_HEXES_STATS) break outer;
    }
  }
  await Promise.all(jobs);

  // Return just the sums for break computation
  return Array.from(aggByHex.values()).map(d=>d.sum).filter(v=>Number.isFinite(v));
}

/* ===== Hardened binning ===== */
function computeBinIndex(breaks, v) {
  if (!Array.isArray(breaks) || breaks.length < 2 || !Number.isFinite(v)) return -1;
  const last = breaks.length - 1;
  if (v <= breaks[0]) return 0;
  if (v >= breaks[last]) return last - 1;
  for (let i = 1; i < breaks.length; i++) {
    if (v < breaks[i] || Math.abs(v - breaks[i]) <= EPS) return i - 1;
  }
  return last - 1;
}

/* ===== Styling & popups (aggregated values) ===== */
function makeStyle(localBreaks, localRamp, opacity=0.65, top10Threshold=Infinity) {
  return (props) => {
    const key = props.h3_index || props.h3 || props.id;
    const agg = key ? aggByHex.get(key) : undefined;
    const v = agg ? agg.sum : undefined;

    if (!Number.isFinite(v)) {
      return { opacity:0, fillOpacity:0, interactive:false };
    }

    const idx = computeBinIndex(localBreaks, v);
    const safeIdx = Math.max(0, Math.min(idx, localRamp.length - 1));
    const color = localRamp[safeIdx] || localRamp[0];

    const isTopDecile = v >= top10Threshold;
    return {
      fill: true,
      fillColor: color,
      fillOpacity: isTopDecile ? Math.min(opacity + 0.15, 0.95) : opacity,
      color: isTopDecile ? '#111' : color,
      weight: isTopDecile ? 1.25 : 0.5
    };
  };
}
function modeFromCounts(obj){
  const entries = Object.entries(obj||{});
  if(!entries.length) return ['–',0];
  // tie-break: prefer newest (bigger key as number)
  entries.sort((a,b)=>{
    if (b[1]!==a[1]) return b[1]-a[1];
    const an=+a[0], bn=+b[0];
    return (Number.isFinite(bn)?bn:0)-(Number.isFinite(an)?an:0);
  });
  return entries[0];
}
function bindHoverPopups(layer, localBreaks){
  let locked=false;
  map.on('keydown', (e)=>{ if(e.originalEvent && e.originalEvent.key==='Escape'){ locked=false; map.closePopup(); }});
  map.on('click', ()=>{ locked=false; });

  layer.on('mouseover', e=>{
    if(locked) return;
    const p = e.layer?.properties || {};
    const key = p.h3_index || p.h3 || p.id;
    const agg = key ? aggByHex.get(key) : undefined;
    const sum = agg ? agg.sum : undefined;
    const uid = agg ? agg.uidCount : undefined;

    const sexParts   = pctParts(agg && agg.sexCounts);
    const stageParts = pctParts(agg && agg.stageCounts);
    const seasonParts= pctParts(agg && agg.seasonCounts);
    const [topYear, yCount]   = modeFromCounts(agg && agg.yearCounts);
    const [topMonth, mCount]  = modeFromCounts(agg && agg.monthCounts);

    const spSel=getMulti('speciesFilter');
    const spLabel=(spSel.length===1)?spSel[0]:(spSel.length>1?'Mixed':'All');

    const partsToHTML=(arr, unknownCount)=> {
      const pctText = arr.length ? arr.map(([k,v])=>`${k} ${nf(v)}%`).join(' · ') : '—';
      const unk = (unknownCount && unknownCount>0) ? ` · Unknown ${nf(unknownCount)}` : '';
      return pctText + unk;
    };

    L.popup({autoPan:false,offset:[0,-8]}).setLatLng(e.latlng).setContent(`
      <div style="min-width:260px">
        <div class="kv"><b>Species</b><span>${spLabel}</span></div>
        <div class="kv"><b>Sum (${metricField})</b><span>${Number.isFinite(sum)?nf(sum):'-'}</span></div>
        <div class="kv"><b>Unique turtle IDs</b><span>${Number.isFinite(uid)?nf(uid):'row-count fallback'}</span></div>
        <hr/>
        <div class="kv"><b>Sex</b><span>${partsToHTML(sexParts.parts, sexParts.unknownCount)}</span></div>
        <div class="kv"><b>Stage</b><span>${partsToHTML(stageParts.parts, stageParts.unknownCount)}</span></div>
        <div class="kv"><b>Season</b><span>${partsToHTML(seasonParts.parts, seasonParts.unknownCount)}</span></div>
        <div class="kv"><b>Top year</b><span>${topYear} (${nf(yCount)})</span></div>
        <div class="kv"><b>Top month</b><span>${topMonth} (${nf(mCount)})</span></div>
        <hr/>
        <small class="muted">h3: ${key ?? '-'}</small>
      </div>`).openOn(map);
  });

  layer.on('mouseout',()=>{ if(!locked) map.closePopup(); });
  layer.on('click',()=>{ locked = !locked; });
}

/* ===== Build / Rebuild ===== */
async function buildLayer(){
  showSpinner('Loading & aggregating…');
  try{
    const res=$('resolution').value, ct=$('counttype').value;
    const pmFile = fileFor(res, ct);
    layerName = await detectLayerName(pmFile);
    const predicate = makePredicate();

    const values = await aggregateAndCollect(pmFile, layerName, predicate, ct);

    // Only replace layer if there is actual data
    const edges = computeSafeBreaks(values);
    if (!edges) {
      showToast('No data in view—zoom out or change filters.');
      hideSpinner();
      return; // keep previous layer visible
    }

    // freeze config for render (race-proof)
    const localBreaks = edges.slice();
    const localRamp   = currentRamp().slice();

    // Optional: top 10% threshold for subtle emphasis
    const sortedVals = values.filter(Number.isFinite).sort((a,b)=>a-b);
    const p90 = sortedVals.length ? ss.quantileSorted(sortedVals, 0.9) : Infinity;

    // Update legend with frozen config
    updateLegend(localBreaks, localRamp);

    if(vtLayer){ map.removeLayer(vtLayer); vtLayer=null; }
    vtLayer = L.vectorGrid.protobuf(`pmtiles://${pmFile}/{z}/{x}/{y}.pbf`,{
      rendererFactory: L.canvas.tile,
      vectorTileLayerStyles: {
        [layerName]: makeStyle(localBreaks, localRamp, 0.65, p90)
      },
      interactive:true,
      getFeatureId: f => f.properties && (f.properties.h3_index || f.properties.h3 || f.properties.id)
    });
    bindHoverPopups(vtLayer, localBreaks);
    vtLayer.addTo(map);
  }catch(err){
    console.error('buildLayer error', err);
    showToast('Failed to load layer. Check console for details.');
  }finally{
    hideSpinner();
  }
}

/* ===== Apply / changes ===== */
$('applyBtn').addEventListener('click',()=>buildLayer());
$('resolution').addEventListener('change',()=>buildLayer());
$('counttype').addEventListener('change',()=>buildLayer());
$('resetBtn').addEventListener('click',()=>{clearAllSelects();buildLayer();});

/* ===== Permalink ===== */
function readStateFromHash(){
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.has('z')&&h.has('lat')&&h.has('lng')) map.setView([+h.get('lat'),+h.get('lng')], +h.get('z'));
  if(h.has('res')) $('resolution').value=h.get('res');
  if(h.has('ct')) $('counttype').value=h.get('ct');
  const ids=['speciesFilter','stageFilter','sexFilter','FishingFilter','Marine_DebrisFilter','AgressionFilter','Boat_collisionFilter','DredgingFilter','OilFilter','PetrolFilter','decompFilter','seasonFilter','yearFilter','monthFilter'];
  for(const id of ids){
    const val=h.get(id); if(!val) continue;
    const wanted=new Set(val.split('|'));
    Array.from($(id).options).forEach(o=>o.selected=wanted.has(o.value));
  }
}
function writeStateToHash(){
  const h=new URLSearchParams(), c=map.getCenter();
  h.set('z',map.getZoom().toFixed(2)); h.set('lat',c.lat.toFixed(6)); h.set('lng',c.lng.toFixed(6));
  h.set('res',$('resolution').value); h.set('ct',$('counttype').value);
  const ids=['speciesFilter','stageFilter','sexFilter','FishingFilter','Marine_DebrisFilter','AgressionFilter','Boat_collisionFilter','DredgingFilter','OilFilter','PetrolFilter','decompFilter','seasonFilter','yearFilter','monthFilter'];
  for(const id of ids){
    const vals=getMulti(id); if(vals.length) h.set(id, vals.join('|'));
  }
  location.hash=h.toString();
}
$('permalink').addEventListener('click',async()=>{
  writeStateToHash();
  try{ await navigator.clipboard.writeText(location.href); showToast('Link copied to clipboard!'); }
  catch{ showToast('Link updated in address bar.'); }
});

/* ===== Boot ===== */
(function init(){ readStateFromHash(); buildLayer(); })();
</script>
