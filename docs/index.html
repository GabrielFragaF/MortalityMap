<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sea Turtle Mortality Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230ea5e9'/%3E%3C/svg%3E'">

<link rel="stylesheet" href="./vendor/leaflet.css?v=20250812"/>
<script src="./vendor/leaflet.js?v=20250812"></script>

<script src="./vendor/pmtiles.js?v=20250812"></script>
<script src="./vendor/Leaflet.VectorGrid.bundled.js?v=20250812"></script>
<script src="./vendor/pbf.js?v=20250812"></script>

<script src="./vendor/simple-statistics.min.js?v=20250812"></script>

<style>
:root{
  --bg:#0b1220;
  --panel:#fff;
  --panel-weak:#f8fafc;
  --text:#0f172a;
  --muted:#64748b;
  --ring:#3b82f6;
  --shadow:0 12px 30px rgba(2,6,23,.18);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,"Helvetica Neue",Arial,sans-serif}
#map{position:absolute;inset:0}

/* ENHANCED: Panel styling */
#panel{
  position:absolute;top:14px;left:14px;z-index:1000;width:360px;
  max-height:calc(100vh - 28px);overflow:auto;background:var(--panel);
  border-radius:16px;box-shadow:var(--shadow);border:1px solid #e2e8f0
}
#panel.collapsed{height:46px;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #e2e8f0;background:var(--panel-weak)}
.topbar h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.2px}
.btn{background:#f1f5f9;border:1px solid #e2e8f0;color:#0f172a;border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(0.98)}
.section{padding:10px 14px}
.row{margin-bottom:10px}
label{display:block;font-weight:700;margin:6px 0;font-size:13px}
select{width:100%;padding:8px 10px;border:1px solid #e2e8f0;border-radius:10px;background:#fff}
select:focus,.btn:focus,input[type="checkbox"]:focus{outline:2px solid rgba(59,130,246,.35);outline-offset:2px}
details{border:1px solid #e2e8f0;border-radius:12px;background:#fff}
details+details{margin-top:10px}
summary{list-style:none;cursor:pointer;padding:10px 12px;font-weight:800;background:#f8fafc;border-radius:12px}
summary::-webkit-details-marker{display:none}
details .content{padding:10px 12px}
.controls-footer{display:flex;gap:10px;justify-content:space-between;margin-top:6px}
#resetBtn,#applyBtn{flex:1;background:#0ea5e9;border:none;color:#fff;border-radius:10px;padding:10px 12px;font-weight:800;cursor:pointer}
#resetBtn{background:#e11d48}
.help{font-size:12px;color:var(--muted);margin-top:4px}

/* NEW: Checkbox groups for Yes/No toggles */
.checkbox-group{border:1px solid #e2e8f0;border-radius:10px;padding:8px}
.checkbox-row{display:flex;align-items:center;gap:8px;padding:6px 4px}
.checkbox-row input[type="checkbox"]{transform:scale(1.1)}

/* ENHANCED: Interactive Legend */
#legend{position:absolute;bottom:18px;right:14px;z-index:1000;background:#fff;border-radius:12px;box-shadow:var(--shadow);border:1px solid #e2e8f0;padding:10px 12px;font-size:13px;min-width:240px}
.leghdr{font-weight:800;margin-bottom:8px;display:flex;justify-content:space-between}
.legend-row{display:flex;align-items:center;margin:4px 0;cursor:pointer;border-radius:6px;padding:4px 6px;transition:background .2s}
.legend-row:hover{background:#f1f5f9}
.legend-row.isolated{background:#fff7ed;border:1px solid #fed7aa}
.swatch{width:26px;height:12px;border-radius:3px;border:1px solid #94a3b8;margin-right:8px}
.histogram{display:flex;align-items:flex-end;gap:2px;height:24px;margin:8px 0}
.hist-bar{flex:1;min-width:3px;background:linear-gradient(to top,rgba(59,130,246,.6),rgba(59,130,246,.85));border-radius:2px;transition:background .2s}
.hist-bar:hover{background:linear-gradient(to top,rgba(234,88,12,.7),#ea580c)}

/* Spinner + toast */
#spinner{position:absolute;top:14px;right:14px;z-index:1000;display:none;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);font-size:13px}
#toast{position:absolute;top:60px;right:14px;z-index:1000;display:none;background:#fee2e2;color:#991b1b;border:1px solid #fecaca;border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);font-size:13px;max-width:360px}
#toast.info{background:#dbeafe;color:#1e40af;border-color:#bfdbfe}
#toast.warn{background:#fef3c7;color:#92400e;border-color:#fde68a}

/* Popup / hover */
.leaflet-popup-content{margin:8px 12px}
.kv{display:flex;justify-content:space-between;gap:10px}
.kv b{color:#0f172a}
small.muted{color:#64748b}
</style>
</head>
<body>
<div id="map"></div>

<div id="panel" aria-label="Filters panel">
  <div class="topbar">
    <h1>Sea Turtle Mortality</h1>
    <div style="display:flex;gap:8px">
      <button id="permalink" class="btn" title="Copy shareable link" aria-label="Copy shareable link">🔗 Share</button>
      <button id="collapseBtn" class="btn" title="Collapse panel" aria-label="Collapse panel">–</button>
    </div>
  </div>

  <div class="section">
    <div class="row">
      <label for="resolution">Resolution (H3)</label>
      <select id="resolution" name="resolution">
        <option value="r3" selected>r3</option>
        <option value="r4">r4</option>
        <option value="r5">r5</option>
        <option value="r6">r6</option>
      </select>
      <div class="help">Start at r3 for speed; switch to r6 for detail.</div>
    </div>

    <div class="row">
      <label for="counttype">Count Type</label>
      <select id="counttype" name="counttype">
        <option value="weight" selected>Mortality position (weight)</option>
        <option value="new_weight">Mortality position (new_weight)</option>
        <option value="new_mortality_est_bf_mean">Mortality estimation (mean)</option>
        <option value="new_mortality_est_bf_low">Mortality estimation (low)</option>
        <option value="new_mortality_est_bf_high">Mortality estimation (high)</option>
      </select>
    </div>
  </div>

  <div class="section">
    <div class="row">
      <label for="speciesFilter">Species</label>
      <select id="speciesFilter" multiple size="6">
        <option value="__ALL__" selected>(All)</option>
        <option value="Caretta caretta">Caretta caretta</option>
        <option value="Chelonia mydas">Chelonia mydas</option>
        <option value="Dermochelys coriacea">Dermochelys coriacea</option>
        <option value="Eretmochelys imbricata">Eretmochelys imbricata</option>
        <option value="Lepidochelys olivacea">Lepidochelys olivacea</option>
      </select>
    </div>

    <div class="row">
      <label for="stageFilter">Development Stage</label>
      <select id="stageFilter" multiple size="5">
        <option value="__ALL__" selected>(All)</option>
        <option>Adult</option>
        <option>Juvenile</option>
        <option>Hatchling</option>
        <option>Unknown</option>
      </select>
    </div>

    <div class="row">
      <label for="sexFilter">Sex</label>
      <select id="sexFilter" multiple size="4">
        <option value="__ALL__" selected>(All)</option>
        <option>Female</option>
        <option>Male</option>
        <option>Unknown</option>
      </select>
    </div>
  </div>

  <div class="section">
    <details>
      <summary>Human interactions</summary>
      <div class="content">
        <div class="row">
          <label>Fishing</label>
          <div class="checkbox-group" id="fishingGroup" role="group" aria-label="Fishing">
            <div class="checkbox-row"><input type="checkbox" id="fishing_all" checked><label for="fishing_all">(All)</label></div>
            <div class="checkbox-row"><input type="checkbox" id="fishing_yes"><label for="fishing_yes">Yes</label></div>
            <div class="checkbox-row"><input type="checkbox" id="fishing_no"><label for="fishing_no">No</label></div>
          </div>
        </div>
        <div class="row">
          <label>Marine Debris</label>
          <div class="checkbox-group" id="marineDebrisGroup" role="group" aria-label="Marine Debris">
            <div class="checkbox-row"><input type="checkbox" id="debris_all" checked><label for="debris_all">(All)</label></div>
            <div class="checkbox-row"><input type="checkbox" id="debris_yes"><label for="debris_yes">Yes</label></div>
            <div class="checkbox-row"><input type="checkbox" id="debris_no"><label for="debris_no">No</label></div>
          </div>
        </div>
        </div>
    </details>
  </div>


  <div class="section">
    <div class="row">
      <label for="decompFilter">Decomposition code</label>
      <select id="decompFilter" multiple size="6">
        <option value="__ALL__" selected>(All)</option>
        <option>1</option><option>2</option><option>3</option>
        <option>4</option><option>5</option>
      </select>
    </div>

    <div class="row">
      <label for="seasonFilter">Season</label>
      <select id="seasonFilter" multiple size="6">
        <option value="__ALL__" selected>(All)</option>
        <option>Autumn</option><option>Spring</option><option>Summer</option><option>Winter</option><option>Unknown</option>
      </select>
    </div>

    <div class="row">
      <label for="yearFilter">Year</label>
      <select id="yearFilter" multiple size="10">
        <option value="__ALL__" selected>(All)</option>
        <option>2015</option><option>2016</option><option>2017</option>
        <option>2018</option><option>2019</option><option>2020</option>
        <option>2021</option><option>2022</option><option>2023</option><option>2024</option>
      </select>
    </div>

    <div class="row">
      <label for="monthFilter">Month</label>
      <select id="monthFilter" multiple size="6">
        <option value="__ALL__" selected>(All)</option>
        <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option>
        <option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option>
      </select>
    </div>
  </div>

  <div class="section">
    <div class="controls-footer">
      <button id="resetBtn" class="btn">Reset</button>
      <button id="applyBtn" class="btn" style="background:#0ea5e9;color:#fff">Apply</button>
    </div>
  </div>
</div>

<div id="legend" aria-live="polite"></div>
<div id="spinner">Loading…</div>
<div id="toast" role="status" aria-live="assertive"></div>

<script>
/* ========= Decoder shim (works with UMD/browserified builds) ========= */
(function ensureDecoders(){
  var VT = (window.VectorTile) || (window.vectorTile && window.vectorTile.VectorTile) || null;
  var PBF = (window.Pbf) || (window.pbf && window.pbf.Pbf) || null;
  if (!window.VectorTile && VT) window.VectorTile = VT;
  if (!window.Pbf && PBF) window.Pbf = PBF;
  window.__VT__ = VT; window.__PBF__ = PBF;
  if (!VT || !PBF) console.warn('Decoder globals missing: vector-tile.js or pbf.js');
})();

/* ========= Map ========= */
const map = L.map('map',{zoomSnap:0.25,worldCopyJump:true}).setView([-24,-45],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors'}).addTo(map);

/* ========= UI helpers ========= */
const $ = id => document.getElementById(id);
const spinner=$('spinner'), toast=$('toast');
const showSpinner = (m='Loading…') => { spinner.textContent=m; spinner.style.display='block'; };
const hideSpinner = () => { spinner.style.display='none'; };
const showToast=(m,ms=5000,type='error')=>{
  toast.textContent=m; toast.className = type==='info'?'info':(type==='warn'?'warn':''); toast.style.display='block';
  setTimeout(()=>toast.style.display='none',ms);
};
$('collapseBtn').addEventListener('click',()=>$('panel').classList.toggle('collapsed'));
window.addEventListener('error',()=>hideSpinner());
window.addEventListener('unhandledrejection',()=>hideSpinner());

/* ========= Filter Controls Logic ========= */

// For <select multiple>
function enforceAllOption(e){
  const sel=e.target;
  if(!sel.multiple) return;
  const all = Array.from(sel.options).find(o=>o.value==='__ALL__');
  if (!all) return;
  const chosen = Array.from(sel.selectedOptions).map(o=>o.value);
  if(chosen.length===0 || (chosen.includes('__ALL__') && chosen.length > 1)){
    Array.from(sel.options).forEach(o=>o.selected= (o.value === '__ALL__'));
  } else if(!chosen.includes('__ALL__') && all.selected){
    all.selected=false;
  }
}
document.querySelectorAll('#panel select[multiple]').forEach(s=>s.addEventListener('change',enforceAllOption));
const getMulti = id => {
  const vals = Array.from($(id)?.selectedOptions||[]).map(o=>o.value);
  return (vals.length===0 || vals.includes('__ALL__')) ? [] : vals;
};

// ENHANCED: For new checkbox groups (Yes/No/All)
function setupCheckboxGroup(groupId){
  const g=$(groupId); if(!g) return;
  const all = g.querySelector('input[id*="_all"]');
  const rest = Array.from(g.querySelectorAll('input:not([id*="_all"])'));
  all.addEventListener('change', e=>{
    if(e.target.checked){ rest.forEach(cb=>cb.checked=false); }
  });
  rest.forEach(cb=>{
    cb.addEventListener('change', e=>{
      if(e.target.checked) all.checked=false;
      if(rest.every(r=>!r.checked)) all.checked=true;
    });
  });
}
['fishingGroup','marineDebrisGroup'].forEach(setupCheckboxGroup);

function getCheckboxValues(groupId){
  const g=$(groupId); if(!g) return [];
  if(g.querySelector('input[id*="_all"]')?.checked) return [];
  return Array.from(g.querySelectorAll('input:not([id*="_all"]):checked'))
    .map(cb=>cb.labels?.[0]?.textContent?.trim())
    .filter(Boolean);
}

const nf=(v)=>{ if(v===0) return '0'; const abs=Math.abs(v); const digits=abs<1?4:abs<10?3:2; return new Intl.NumberFormat(undefined,{maximumFractionDigits:digits}).format(v); };

/* ========= Colors & Legend State ========= */
const ramps={
  'Caretta caretta':['#feedde','#fdbe85','#fd8d3c','#e6550d','#a63603'],
  'Chelonia mydas':['#edf8e9','#bae4b3','#74c476','#31a354','#006d2c'],
  'Dermochelys coriacea':['#eff3ff','#bdd7e7','#6baed6','#3182bd','#08519c'],
  'Eretmochelys imbricata':['#f2f0f7','#cbc9e2','#9e9ac8','#756bb1','#54278f'],
  'Lepidochelys olivacea':['#f7fcf5','#d9f0d3','#a6dba0','#5aae61','#1b7837'],
  'multi':['#fee5d9','#fcae91','#fb6a4a','#de2d26','#a50f15']
};
let isolatedBin=-1;

/* ========= Canonicalization (Data Cleaning) ========= */
const canon = {
  season: v => {
    const s=(v??'').toString().toLowerCase().trim();
    if(!s) return 'Unknown';
    if(['outono','autumn','fall'].includes(s)) return 'Autumn';
    if(['primavera','spring'].includes(s)) return 'Spring';
    if(['verao','verão','summer'].includes(s)) return 'Summer';
    if(['inverno','winter'].includes(s)) return 'Winter';
    return 'Unknown';
  },
  sex: v => {
    const s=(v??'').toString().toLowerCase().trim();
    if(['fêmea','femea','female','f'].includes(s)) return 'Female';
    if(['macho','male','m'].includes(s)) return 'Male';
    return 'Unknown';
  },
  stage: v => {
    const s=(v??'').toString().toLowerCase().trim();
    if(['adulto','adult'].includes(s)) return 'Adult';
    if(['juvenil','juvenile'].includes(s)) return 'Juvenile';
    if(['filhote','hatchling'].includes(s)) return 'Hatchling';
    return 'Unknown';
  },
  year: v => {
    if(v==null) return '';
    const n=parseInt(String(v).replace(/\.0+$/,''),10);
    return Number.isFinite(n)?String(n):'';
  },
  // FIXED: Add a robust handler for "Yes/No" type data
  binary: v => {
    const s = (v ?? '').toString().toLowerCase().trim();
    if (['yes', 'y', 'true', '1', 'sim', 's'].includes(s)) return 'Yes';
    if (['no', 'n', 'false', '0', 'nao', 'não'].includes(s)) return 'No';
    return 'Unknown';
  }
};
const asIntString=v=>{ const n=parseInt(v,10); return Number.isFinite(n)?String(n):String(v); };

/* ========= pmtiles:// fetch shim ========= */
const origFetch = window.fetch.bind(window);
const pmCache = new Map();
async function getPM(archive){
  const u=new URL(archive, new URL('.', location.href)).toString();
  if(pmCache.has(u)) return pmCache.get(u);
  const inst=new pmtiles.PMTiles(u);
  pmCache.set(u,inst);
  return inst;
}
window.fetch = async (input, init) => {
  if (typeof input === 'string' && input.startsWith('pmtiles://')) {
    const m = input.match(/^pmtiles:\/\/(.+?)\/(\d+)\/(\d+)\/(\d+)\.pbf$/);
    if (!m) return Promise.reject(new Error('Bad pmtiles URL'));
    const [_, archive, z, x, y] = m;
    try{
      const pm = await getPM(archive);
      const t = await pm.getZxy(+z,+x,+y);
      if(!t || !t.data){ return new Response(null,{status:204}); }
      return new Response(t.data);
    }catch(e){
      console.warn('Tile fetch failed for', archive, z, x, y, e);
      return new Response(null,{status:204});
    }
  }
  return origFetch(input, init);
};

/* ========= State & Helpers ========= */
let vtLayer=null, layerNames=[], header=null;
const aggByHex=new Map();
let metricField='sum_val';
const stats = (window.ss || window.simpleStatistics || null);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function fileFor(res, ct){ const v='20250812'; return `hexgrid_${res}_${ct}.pmtiles?v=${v}`; }
// FIXED: More robust UID counter that includes 'turtle_id'
function getUidCountFromProps(p){
  const keys = ['turtle_id', 'uid_count', 'unique_ids', 'unique_turtle_ids', 'count'];
  for(const k of keys){
    const n = Number(p[k]);
    if (Number.isFinite(n)) return n;
  }
  return null;
}

/* ========= Filtering Predicate ========= */
// FIXED: This whole function is rewritten to be more robust
function makePredicate(){
  const sel={
    species: new Set(getMulti('speciesFilter')),
    stage: new Set(getMulti('stageFilter')),
    sex: new Set(getMulti('sexFilter')),
    fishing: new Set(getCheckboxValues('fishingGroup')),
    marine_debris: new Set(getCheckboxValues('marineDebrisGroup')),
    season: new Set(getMulti('seasonFilter')),
    year: new Set(getMulti('yearFilter')),
    month: new Set(getMulti('monthFilter')),
    decomp: new Set(getMulti('decompFilter'))
  };

  const hasFilter = key => sel[key] && sel[key].size > 0;

  return p => {
    if (hasFilter('species') && !sel.species.has(p.species)) return false;
    if (hasFilter('stage') && !sel.stage.has(canon.stage(p.development_stage))) return false;
    if (hasFilter('sex') && !sel.sex.has(canon.sex(p.sex))) return false;
    
    // Check multiple property casings for robustness
    if (hasFilter('fishing') && !sel.fishing.has(canon.binary(p.fishing ?? p.Fishing))) return false;
    if (hasFilter('marine_debris') && !sel.marine_debris.has(canon.binary(p.marine_debris ?? p.Marine_Debris))) return false;
    
    if (hasFilter('season') && !sel.season.has(canon.season(p.season))) return false;
    if (hasFilter('year') && !sel.year.has(canon.year(p.year))) return false;
    if (hasFilter('month') && !sel.month.has(asIntString(p.month))) return false;
    if (hasFilter('decomp') && !sel.decomp.has(asIntString(p.decomposition_code))) return false;

    return true; // If all checks pass, include the feature
  };
}


/* ========= Data Aggregation & Analysis ========= */
async function aggregateAndCollect(pmFile, predicate, ct){
  aggByHex.clear();
  const allValues = [];
  try{
    if(!__VT__ || !__PBF__){
      showToast('Decoders not loaded (vector-tile/pbf).', 4000, 'warn');
      return allValues;
    }
    const pm = await getPM(pmFile);
    const hdr = await pm.getHeader();
    const z = clamp(Math.floor(map.getZoom()), hdr.minZoom, hdr.maxZoom);
    
    const tileCoords = [];
    const bounds = map.getBounds();
    const {minX, maxX, minY, maxY} = L.bounds( L.point(bounds.getWest(), bounds.getNorth()), L.point(bounds.getEast(), bounds.getSouth()) );

    // This part would need a proper tile enumeration for the given projection,
    // for simplicity and because the original had a similar logic, we'll assume a simplified tile scan.
    // A production version would use a library or more careful math.
    const tileCheckLimit = 100; // Limit tiles to check to avoid browser freeze
    const jobs = [];
    // Simplified tile fetching logic for demonstration
    const centerTile = L.CRS.EPSG3857.latLngToPoint(map.getCenter(), z).divideBy(256).floor();
    for (let i = -5; i <= 5; i++) {
        for (let j = -5; j <= 5; j++) {
            const tilePoint = centerTile.add(L.point(i, j));
            jobs.push(pm.getZxy(z, tilePoint.x, tilePoint.y));
        }
    }
    
    const tiles = await Promise.allSettled(jobs);
    let firstFeatureProps = null;

    for (const tileResult of tiles) {
      if (tileResult.status !== 'fulfilled' || !tileResult.value?.data) continue;
      const vt = new __VT__(new __PBF__(tileResult.value.data));
      for (const layerName in vt.layers) {
        const layer = vt.layers[layerName];
        for (let i = 0; i < layer.length; i++) {
          const f = layer.feature(i);
          if (!predicate(f.properties)) continue;
          
          if (!firstFeatureProps) firstFeatureProps = f.properties;

          const key = f.properties.h3_index ?? f.properties.h3 ?? f.properties.id;
          if (!key) continue;

          const uid = getUidCountFromProps(f.properties);
          const entry = aggByHex.get(key) || { sum: 0, uidCount: 0 };
          
          entry.sum += Number(f.properties[metricField] || 0);
          entry.uidCount += (uid !== null ? uid : 1); // Use UID if present, else count the row
          
          aggByHex.set(key, entry);
        }
      }
    }
    
    // Discover the metric field from the first valid feature
    if (firstFeatureProps) {
        const cands = {
            weight: ['sum_val','weight'], new_weight: ['sum_val','new_weight'],
            new_mortality_est_bf_mean: ['sum_val','new_mortality_est_bf_mean'],
            new_mortality_est_bf_low: ['sum_val','new_mortality_est_bf_low'],
            new_mortality_est_bf_high: ['sum_val','new_mortality_est_bf_high']
        }[ct] || ['sum_val'];
        metricField = cands.find(c => firstFeatureProps[c] !== undefined) || 'sum_val';
    }

    aggByHex.forEach(v => allValues.push(v.sum));

  }catch(e){
    console.warn('aggregateAndCollect failed', e);
  }
  return allValues;
}

function computeSafeBreaks(values){
  if(!stats) return [0,1,2,3,4,5];
  const sorted = values.filter(Number.isFinite).sort((a,b)=>a-b);
  if(sorted.length < 5) return [0,1,2,3,4,5];
  try {
      let breaks = stats.jenks(sorted, 5);
      // Ensure breaks are unique
      breaks = [...new Set(breaks)];
      while(breaks.length < 6) {
          breaks = stats.quantile(sorted, [0, 0.2, 0.4, 0.6, 0.8, 1]);
          breaks = [...new Set(breaks)];
          if (breaks.length < 2) return [sorted[0], sorted[0]+1];
      }
      return breaks;
  } catch {
      return stats.quantile(sorted, [0, 0.2, 0.4, 0.6, 0.8, 1]);
  }
}

/* ========= Legend, Style, Popups ========= */
function computeBinIndex(breaks, v){
  if(!Array.isArray(breaks) || breaks.length<2 || !Number.isFinite(v)) return -1;
  const n=breaks.length-1;
  if(v<=breaks[0]) return 0;
  if(v>=breaks[n]) return n-1;
  for(let i=1;i<breaks.length;i++){ if(v <= breaks[i]) return i-1; }
  return n-1;
}

// ENHANCED: Interactive Legend
function updateLegend(localBreaks, localRamp, cellValues=[]){
  const el=$('legend');
  const spSel=getMulti('speciesFilter');
  const name=(spSel.length===1)?spSel[0]:(spSel.length>1?'Multiple species':'All species');
  el.innerHTML=`<div class="leghdr"><span>${name}</span><span>${nf(cellValues.length)} cells</span></div>`;

  if (!localBreaks || localBreaks.length < 2) {
      el.insertAdjacentHTML('beforeend','<div>No data to classify.</div>');
      return;
  }

  const n=Math.min(localRamp.length, localBreaks.length-1);
  const hist=new Array(n).fill(0);
  cellValues.forEach(v=>{
    const b=computeBinIndex(localBreaks,v);
    if(b>=0 && b<hist.length) hist[b]++;
  });
  const maxH=Math.max(...hist,1);
  el.insertAdjacentHTML('beforeend', `<div class="histogram">${hist.map(c=>`<div class="hist-bar" style="height:${Math.max(2,Math.round(c/maxH*22))}px" title="${nf(c)} cells"></div>`).join('')}</div>`);

  for(let i=0;i<n;i++){
    const a=localBreaks[i], b=localBreaks[i+1], iso=(isolatedBin===i)?' isolated':'';
    el.insertAdjacentHTML('beforeend', `<div class="legend-row${iso}" data-bin="${i}" title="${nf(a)} – ${nf(b)}"><span class="swatch" style="background:${localRamp[i]}"></span><span>${nf(a)} – ${nf(b)}</span></div>`);
  }
  el.querySelectorAll('.legend-row[data-bin]').forEach(row=>{
    row.addEventListener('click', e=>{
      const bin=parseInt(e.currentTarget.dataset.bin,10);
      isolatedBin=(isolatedBin===bin)?-1:bin;
      buildLayer();
    });
  });
}

function makeStyle(localBreaks, localRamp){
  return (props)=>{
    const key = props.h3_index || props.h3 || props.id;
    const agg = key ? aggByHex.get(key) : undefined;
    const v = agg ? agg.sum : undefined;
    if(!Number.isFinite(v) || v === 0){ return {opacity:0, fillOpacity:0, interactive:false}; }
    const idx = computeBinIndex(localBreaks, v);
    if(isolatedBin>=0 && idx!==isolatedBin){ return {opacity:0.1, color: '#aaa', weight: 0.5, fillOpacity:0}; }
    const color = localRamp[Math.max(0,Math.min(idx, localRamp.length-1))] || localRamp[0];
    return {fill:true, fillColor:color, fillOpacity:0.7, color, weight:0.8, interactive:true};
  };
}

function bindHoverPopups(layer){
  layer.on('mouseover', e=>{
    const p = e.layer?.properties||{};
    const key = p.h3_index || p.h3 || p.id;
    const agg = key ? aggByHex.get(key) : undefined;
    if(!agg) return;
    const html = `<div style="min-width:240px">
        <div class="kv"><b>Sum (${metricField})</b><span>${nf(agg.sum)}</span></div>
        <div class="kv"><b>Unique Turtles</b><span>${nf(agg.uidCount)}</span></div>
        <hr/><small class="muted">H3: ${key}</small>
      </div>`;
    L.popup({autoPan:false,offset:[0,-8]}).setLatLng(e.latlng).setContent(html).openOn(map);
  });
  layer.on('mouseout',()=>map.closePopup());
}

/* ========= Build / Rebuild Orchestrator ========= */
async function buildLayer(){
  showSpinner('Loading & aggregating…');
  try{
    const res=$('resolution').value, ct=$('counttype').value;
    const pmFile=fileFor(res, ct);
    const predicate = makePredicate();

    const values = await aggregateAndCollect(pmFile, predicate, ct);

    if (values.length === 0) {
      showToast('No data in view—zoom out or change filters.', 4000, 'info');
      if (vtLayer) map.removeLayer(vtLayer);
      updateLegend([],[],[]);
      hideSpinner();
      return;
    }

    const breaks = computeSafeBreaks(values);
    const ramp = ramps[getMulti('speciesFilter').length === 1 ? getMulti('speciesFilter')[0] : 'multi'] || ramps['multi'];

    updateLegend(breaks, ramp, values);
    
    if(vtLayer){ map.removeLayer(vtLayer); vtLayer=null; }
    vtLayer = L.vectorGrid.protobuf(`pmtiles://${pmFile}/{z}/{x}/{y}.pbf`,{
      rendererFactory: L.canvas.tile,
      vectorTileLayerStyles: { 'hexgrid': makeStyle(breaks, ramp) }, // Assumes layer name is 'hexgrid'
      interactive:true,
      getFeatureId: f => f.properties.h3_index || f.properties.h3 || f.properties.id
    });
    bindHoverPopups(vtLayer);
    vtLayer.addTo(map);

  }catch(err){
    console.error('buildLayer error:', err);
    showToast('Failed to load layer. See console for details.',5000,'error');
  }finally{
    hideSpinner();
  }
}

/* ========= Controls & Initial Load ========= */
$('applyBtn').addEventListener('click',()=>buildLayer());
$('resetBtn').addEventListener('click',()=>{
  document.querySelectorAll('#panel select').forEach(s => {
      if (s.multiple) {
          Array.from(s.options).forEach(o => o.selected = (o.value === '__ALL__'));
      } else {
          s.selectedIndex = 0;
      }
  });
  document.querySelectorAll('.checkbox-group input[id*="_all"]').forEach(cb => cb.checked = true);
  document.querySelectorAll('.checkbox-group input:not([id*="_all"])').forEach(cb => cb.checked = false);
  isolatedBin = -1;
  buildLayer();
});


(function init(){
  // A simple permalink reader could go here if needed
  buildLayer();
})();
</script>
