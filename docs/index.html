<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sea Turtle Mortality Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- Favicon (prevents 404) -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230ea5e9'/%3E%3C/svg%3E'">

<!-- Leaflet (local, CSP-safe) -->
<link rel="stylesheet" href="./vendor/leaflet.css"/>
<script src="./vendor/leaflet.js"></script>

<!-- PMTiles / VectorGrid / PBF / VectorTile / Simple-Statistics (local, CSP-safe) -->
<script src="./vendor/pmtiles.js"></script>
<script src="./vendor/Leaflet.VectorGrid.bundled.js"></script>
<script src="./vendor/pbf.js"></script>
<script src="./vendor/vector-tile.js"></script>
<script src="./vendor/simple-statistics.min.js"></script>

<style>
:root{
  --bg:#0b1220;
  --panel:#fff;
  --panel-weak:#f8fafc;
  --text:#0f172a;
  --muted:#64748b;
  --ring:#3b82f6;
  --shadow:0 12px 30px rgba(2,6,23,.18);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,"Helvetica Neue",Arial,sans-serif}
#map{position:absolute;inset:0}

/* Panel (unchanged layout; small a11y polish) */
#panel{
  position:absolute;top:14px;left:14px;z-index:1000;width:360px;
  max-height:90vh;overflow:auto;background:var(--panel);
  border-radius:16px;box-shadow:var(--shadow);border:1px solid #e2e8f0
}
#panel.collapsed{height:46px;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #e2e8f0;background:var(--panel-weak)}
.topbar h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.2px}
.btn{background:#f1f5f9;border:1px solid #e2e8f0;color:#0f172a;border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(0.98)}
.section{padding:10px 14px}
.row{margin-bottom:10px}
label{display:block;font-weight:700;margin:6px 0;font-size:13px}
select{width:100%;padding:8px 10px;border:1px solid #e2e8f0;border-radius:10px;background:#fff}
select:focus,.btn:focus,input[type="checkbox"]:focus{outline:2px solid rgba(59,130,246,.35);outline-offset:2px}
details{border:1px solid #e2e8f0;border-radius:12px;background:#fff}
details+details{margin-top:10px}
summary{list-style:none;cursor:pointer;padding:10px 12px;font-weight:800;background:#f8fafc;border-radius:12px}
summary::-webkit-details-marker{display:none}
details .content{padding:10px 12px}
.controls-footer{display:flex;gap:10px;justify-content:space-between;margin-top:6px}
#resetBtn,#applyBtn{flex:1;background:#0ea5e9;border:none;color:#fff;border-radius:10px;padding:10px 12px;font-weight:800;cursor:pointer}
#resetBtn{background:#e11d48}
.help{font-size:12px;color:var(--muted);margin-top:4px}

/* Checkbox groups (simple; keep existing look) */
.checkbox-group{border:1px solid #e2e8f0;border-radius:10px;padding:8px}
.checkbox-row{display:flex;align-items:center;gap:8px;padding:6px 4px}
.checkbox-row.all{border-bottom:1px solid #eef2f7;margin-bottom:6px;padding-bottom:8px}
.checkbox-row input[type="checkbox"]{transform:scale(1.1)}

/* Legend bottom-right */
#legend{position:absolute;bottom:18px;right:14px;z-index:1000;background:#fff;border-radius:12px;box-shadow:var(--shadow);border:1px solid #e2e8f0;padding:10px 12px;font-size:13px;min-width:240px}
.leghdr{font-weight:800;margin-bottom:8px;display:flex;justify-content:space-between}
.legend-row{display:flex;align-items:center;margin:4px 0;cursor:pointer;border-radius:6px;padding:4px 6px}
.legend-row:hover{background:#f1f5f9}
.legend-row.isolated{background:#fff7ed;border:1px solid #fed7aa}
.swatch{width:26px;height:12px;border-radius:3px;border:1px solid #94a3b8;margin-right:8px}
.histogram{display:flex;align-items:flex-end;gap:2px;height:24px;margin:8px 0}
.hist-bar{flex:1;min-width:3px;background:linear-gradient(to top,rgba(59,130,246,.6),rgba(59,130,246,.85));border-radius:2px}

/* Spinner + toast */
#spinner{position:absolute;top:14px;right:14px;z-index:1000;display:none;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);font-size:13px}
#toast{position:absolute;top:60px;right:14px;z-index:1000;display:none;background:#fee2e2;color:#991b1b;border:1px solid #fecaca;border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);font-size:13px;max-width:360px}
#toast.info{background:#dbeafe;color:#1e40af;border-color:#bfdbfe}
#toast.warn{background:#fef3c7;color:#92400e;border-color:#fde68a}

/* Popup / hover */
.leaflet-popup-content{margin:8px 12px}
.kv{display:flex;justify-content:space-between;gap:10px}
.kv b{color:#0f172a}
small.muted{color:#64748b}
</style>
</head>
<body>
<div id="map"></div>

<!-- Panel -->
<div id="panel" aria-label="Filters panel">
  <div class="topbar">
    <h1>Sea Turtle Mortality</h1>
    <div style="display:flex;gap:8px">
      <button id="permalink" class="btn" title="Copy shareable link" aria-label="Copy shareable link">🔗 Share</button>
      <button id="collapseBtn" class="btn" title="Collapse panel" aria-label="Collapse panel">–</button>
    </div>
  </div>

  <div class="section">
    <div class="row">
      <label for="resolution">Resolution (H3)</label>
      <select id="resolution" name="resolution">
        <option value="r3" selected>r3</option>
        <option value="r4">r4</option>
        <option value="r5">r5</option>
        <option value="r6">r6</option>
      </select>
      <div class="help">Start at r3 for speed; switch to r6 for detail.</div>
    </div>

    <div class="row">
      <label for="counttype">Count Type</label>
      <select id="counttype" name="counttype">
        <option value="weight" selected>Mortality position (weight)</option>
        <option value="new_weight">Mortality position (new_weight)</option>
        <option value="new_mortality_est_bf_mean">Mortality estimation (mean)</option>
        <option value="new_mortality_est_bf_low">Mortality estimation (low)</option>
        <option value="new_mortality_est_bf_high">Mortality estimation (high)</option>
      </select>
    </div>
  </div>

  <!-- Species & Biology -->
  <div class="section">
    <div class="row">
      <label>Species</label>
      <div class="checkbox-group" id="speciesGroup" role="group" aria-label="Species">
        <div class="checkbox-row all">
          <input type="checkbox" id="species_all" aria-checked="true" checked>
          <label for="species_all">(All)</label>
        </div>
        <div class="checkbox-row"><input type="checkbox" id="species_caretta"><label for="species_caretta">Caretta caretta</label></div>
        <div class="checkbox-row"><input type="checkbox" id="species_chelonia"><label for="species_chelonia">Chelonia mydas</label></div>
        <div class="checkbox-row"><input type="checkbox" id="species_dermochelys"><label for="species_dermochelys">Dermochelys coriacea</label></div>
        <div class="checkbox-row"><input type="checkbox" id="species_eretmochelys"><label for="species_eretmochelys">Eretmochelys imbricata</label></div>
        <div class="checkbox-row"><input type="checkbox" id="species_lepidochelys"><label for="species_lepidochelys">Lepidochelys olivacea</label></div>
      </div>
    </div>

    <div class="row">
      <label>Development Stage</label>
      <div class="checkbox-group" id="stageGroup" role="group" aria-label="Development Stage">
        <div class="checkbox-row all"><input type="checkbox" id="stage_all" checked><label for="stage_all">(All)</label></div>
        <div class="checkbox-row"><input type="checkbox" id="stage_adult"><label for="stage_adult">Adult</label></div>
        <div class="checkbox-row"><input type="checkbox" id="stage_juvenile"><label for="stage_juvenile">Juvenile</label></div>
        <div class="checkbox-row"><input type="checkbox" id="stage_hatchling"><label for="stage_hatchling">Hatchling</label></div>
        <div class="checkbox-row"><input type="checkbox" id="stage_unknown"><label for="stage_unknown">Unknown</label></div>
      </div>
    </div>

    <div class="row">
      <label>Sex</label>
      <div class="checkbox-group" id="sexGroup" role="group" aria-label="Sex">
        <div class="checkbox-row all"><input type="checkbox" id="sex_all" checked><label for="sex_all">(All)</label></div>
        <div class="checkbox-row"><input type="checkbox" id="sex_female"><label for="sex_female">Female</label></div>
        <div class="checkbox-row"><input type="checkbox" id="sex_male"><label for="sex_male">Male</label></div>
        <div class="checkbox-row"><input type="checkbox" id="sex_unknown"><label for="sex_unknown">Unknown</label></div>
      </div>
    </div>
  </div>

  <!-- Human Interactions -->
  <div class="section">
    <details>
      <summary>Human interactions</summary>
      <div class="content">
        <div class="row">
          <label>Fishing</label>
          <div class="checkbox-group" id="fishingGroup" role="group" aria-label="Fishing">
            <div class="checkbox-row all"><input type="checkbox" id="fishing_all" checked><label for="fishing_all">(All)</label></div>
            <div class="checkbox-row"><input type="checkbox" id="fishing_yes"><label for="fishing_yes">Yes</label></div>
            <div class="checkbox-row"><input type="checkbox" id="fishing_no"><label for="fishing_no">No</label></div>
          </div>
        </div>
        <div class="row">
          <label>Marine Debris</label>
          <div class="checkbox-group" id="marineDebrisGroup" role="group" aria-label="Marine Debris">
            <div class="checkbox-row all"><input type="checkbox" id="debris_all" checked><label for="debris_all">(All)</label></div>
            <div class="checkbox-row"><input type="checkbox" id="debris_yes"><label for="debris_yes">Yes</label></div>
            <!-- fixed "for" typo here -->
            <div class="checkbox-row"><input type="checkbox" id="debris_no"><label for="debris_no">No</label></div>
          </div>
        </div>
        <div class="row">
          <label>Boat collision</label>
          <div class="checkbox-group" id="boatGroup" role="group" aria-label="Boat collision">
            <div class="checkbox-row all"><input type="checkbox" id="boat_all" checked><label for="boat_all">(All)</label></div>
            <div class="checkbox-row"><input type="checkbox" id="boat_yes"><label for="boat_yes">Yes</label></div>
            <div class="checkbox-row"><input type="checkbox" id="boat_no"><label for="boat_no">No</label></div>
          </div>
        </div>
        <div class="row">
          <label>Dredging</label>
          <div class="checkbox-group" id="dredgingGroup" role="group" aria-label="Dredging">
            <div class="checkbox-row all"><input type="checkbox" id="dredging_all" checked><label for="dredging_all">(All)</label></div>
            <div class="checkbox-row"><input type="checkbox" id="dredging_yes"><label for="dredging_yes">Yes</label></div>
            <div class="checkbox-row"><input type="checkbox" id="dredging_no"><label for="dredging_no">No</label></div>
          </div>
        </div>
        <div class="row">
          <label>Oil</label>
          <div class="checkbox-group" id="oilGroup" role="group" aria-label="Oil">
            <div class="checkbox-row all"><input type="checkbox" id="oil_all" checked><label for="oil_all">(All)</label></div>
            <div class="checkbox-row"><input type="checkbox" id="oil_yes"><label for="oil_yes">Yes</label></div>
            <div class="checkbox-row"><input type="checkbox" id="oil_no"><label for="oil_no">No</label></div>
          </div>
        </div>
        <div class="row">
          <label>Petrol</label>
          <div class="checkbox-group" id="petrolGroup" role="group" aria-label="Petrol">
            <div class="checkbox-row all"><input type="checkbox" id="petrol_all" checked><label for="petrol_all">(All)</label></div>
            <div class="checkbox-row"><input type="checkbox" id="petrol_yes"><label for="petrol_yes">Yes</label></div>
            <div class="checkbox-row"><input type="checkbox" id="petrol_no"><label for="petrol_no">No</label></div>
          </div>
        </div>
      </div>
    </details>
  </div>

  <!-- Environment & time -->
  <div class="section">
    <div class="row">
      <label for="decompFilter">Decomposition code</label>
      <select id="decompFilter" name="decompFilter" multiple size="6">
        <option value="__ALL__" selected>(All)</option>
        <option>1</option><option>2</option><option>3</option>
        <option>4</option><option>5</option>
      </select>
    </div>

    <div class="row">
      <label>Season</label>
      <div class="checkbox-group" id="seasonGroup" role="group" aria-label="Season">
        <div class="checkbox-row all"><input type="checkbox" id="season_all" checked><label for="season_all">(All)</label></div>
        <div class="checkbox-row"><input type="checkbox" id="season_autumn"><label for="season_autumn">Autumn</label></div>
        <div class="checkbox-row"><input type="checkbox" id="season_spring"><label for="season_spring">Spring</label></div>
        <div class="checkbox-row"><input type="checkbox" id="season_summer"><label for="season_summer">Summer</label></div>
        <div class="checkbox-row"><input type="checkbox" id="season_winter"><label for="season_winter">Winter</label></div>

      </div>
    </div>

    <div class="row">
      <label for="yearFilter">Year</label>
      <select id="yearFilter" name="yearFilter" multiple size="10">
        <option value="__ALL__" selected>(All)</option>
        <option>2015</option><option>2016</option><option>2017</option>
        <option>2018</option><option>2019</option><option>2020</option>
        <option>2021</option><option>2022</option><option>2023</option><option>2024</option>
      </select>
    </div>

    <div class="row">
      <label for="monthFilter">Month</label>
      <select id="monthFilter" name="monthFilter" multiple size="6">
        <option value="__ALL__" selected>(All)</option>
        <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option>
        <option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option>
      </select>
    </div>

  <div class="section">
    <div class="controls-footer">
      <button id="resetBtn" class="btn" aria-label="Reset all filters">Reset</button>
      <button id="applyBtn" class="btn" aria-label="Apply filters" style="background:#0ea5e9;color:#fff">Apply</button>
    </div>
  </div>
</div>

<div id="legend" aria-live="polite"></div>
<div id="spinner">Loading…</div>
<div id="toast" role="status" aria-live="assertive"></div>

<script>
/* ========= Decoder shim (works with UMD/browserified builds) ========= */
(function ensureDecoders(){
  var VT = (window.VectorTile)
        || (window.vectorTile && window.vectorTile.VectorTile)
        || (window.mapbox_vector_tile && window.mapbox_vector_tile.VectorTile)
        || null;

  var PBF = (window.Pbf)
         || (window.pbf && window.pbf.Pbf)
         || null;

  if (!window.VectorTile && VT) window.VectorTile = VT;
  if (!window.Pbf && PBF) window.Pbf = PBF;

  window.__VT__ = VT || window.VectorTile || null;
  window.__PBF__ = PBF || window.Pbf || null;

  if (!window.__VT__ || !window.__PBF__) {
    console.warn('Decoder globals missing:',
      (!window.__VT__?'vector-tile.js ':'') + (!window.__PBF__?'pbf.js':'')
    );
  }
})();

/* ========= Map ========= */
const map = L.map('map',{zoomSnap:0.25,worldCopyJump:true}).setView([-24,-45],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors'}).addTo(map);

/* ========= UI helpers ========= */
const $ = id => document.getElementById(id);
const spinner=$('spinner'), toast=$('toast');
const showSpinner = (m='Loading…') => { spinner.textContent=m; spinner.style.display='block'; };
const hideSpinner = () => { spinner.style.display='none'; };
const showToast=(m,ms=5000,type='error')=>{
  toast.textContent=m; toast.className = type==='info'?'info':(type==='warn'?'warn':''); toast.style.display='block';
  setTimeout(()=>toast.style.display='none',ms);
};
$('collapseBtn').addEventListener('click',()=>$('panel').classList.toggle('collapsed'));
window.addEventListener('error',()=>hideSpinner());
window.addEventListener('unhandledrejection',()=>hideSpinner());

/* ========= Checkbox groups (keep All logic) ========= */
function setupCheckboxGroup(groupId){
  const g=$(groupId); if(!g) return;
  const all = g.querySelector('.all input');
  const rest = Array.from(g.querySelectorAll(':scope input:not(.all input)'));
  all.addEventListener('change', e=>{
    if(e.target.checked){ rest.forEach(cb=>cb.checked=false); }
  });
  rest.forEach(cb=>{
    cb.addEventListener('change', e=>{
      if(e.target.checked) all.checked=false;
      if(rest.every(r=>!r.checked)) all.checked=true;
    });
  });
}
['speciesGroup','stageGroup','sexGroup','fishingGroup','marineDebrisGroup','boatGroup','dredgingGroup','oilGroup','petrolGroup','seasonGroup'].forEach(setupCheckboxGroup);

function getCheckboxValues(groupId){
  const g=$(groupId); if(!g) return [];
  if(g.querySelector('.all input')?.checked) return [];
  return Array.from(g.querySelectorAll(':scope input:not(.all input):checked'))
    .map(cb=>cb.labels?.[0]?.textContent?.trim())
    .filter(Boolean);
}

/* ========= Multi-select (year/month, decomp) ========= */
function enforceAllOption(e){
  const sel=e.target; if(!sel.multiple) return;
  const all = Array.from(sel.options).find(o=>o.value==='__ALL__');
  const chosen = Array.from(sel.selectedOptions).map(o=>o.value);
  if(chosen.length===0){ all.selected=true; }
  else if(chosen.includes('__ALL__') && chosen.length>1){
    Array.from(sel.options).forEach(o=>o.selected=false); all.selected=true;
  }else if(!chosen.includes('__ALL__') && all.selected){ all.selected=false; }
}
document.querySelectorAll('#panel select[multiple]').forEach(s=>s.addEventListener('change',enforceAllOption));
const getMulti = id => {
  const vals = Array.from($(id).selectedOptions||[]).map(o=>o.value);
  return (vals.length===0 || vals.includes('__ALL__')) ? [] : vals;
};
const nf=(v)=>{ if(v===0) return '0'; const abs=Math.abs(v); const digits=abs<1?4:abs<10?3:2; return new Intl.NumberFormat(undefined,{maximumFractionDigits:digits}).format(v); };

/* ========= Colors ========= */
const ramps={
  'Caretta caretta':['#feedde','#fdbe85','#fd8d3c','#e6550d','#a63603'],
  'Chelonia mydas':['#edf8e9','#bae4b3','#74c476','#31a354','#006d2c'],
  'Dermochelys coriacea':['#eff3ff','#bdd7e7','#6baed6','#3182bd','#08519c'],
  'Eretmochelys imbricata':['#f2f0f7','#cbc9e2','#9e9ac8','#756bb1','#54278f'],
  'Lepidochelys olivacea':['#f7fcf5','#d9f0d3','#a6dba0','#5aae61','#1b7837'],
  'multi':['#fee5d9','#fcae91','#fb6a4a','#de2d26','#a50f15']
};
let activeRamp=ramps['multi'];
let isolatedBin=-1;

/* ========= Legend ========= */
function computeBinIndex(breaks, v){
  if(!Array.isArray(breaks) || breaks.length<2 || !Number.isFinite(v)) return -1;
  const n=breaks.length-1;
  if(v<=breaks[0]) return 0;
  if(v>=breaks[n]) return n-1;
  for(let i=1;i<breaks.length;i++){
    if(v <= breaks[i]) return i-1;
  }
  return n-1;
}
function updateLegend(localBreaks, localRamp, cellValues=[]){
  const el=$('legend');
  const ramp=(Array.isArray(localRamp)&&localRamp.length)?localRamp.slice():ramps['multi'];
  const brks=(Array.isArray(localBreaks)&&localBreaks.length>1)?localBreaks.slice():[0,1,2,3,4,5];

  const spSel=getCheckboxValues('speciesGroup');
  const name=(spSel.length===1)?spSel[0]:(spSel.length>1?'Multiple species':'All species');
  el.innerHTML=`<div class="leghdr"><span>${name}</span><span>${nf(cellValues.length)} cells</span></div>`;

  const n=Math.min(ramp.length, brks.length-1);
  if(n<=0){ el.insertAdjacentHTML('beforeend','<div>No data in view</div>'); return; }

  // mini histogram
  const hist=new Array(n).fill(0);
  const vals = cellValues.filter(Number.isFinite);
  vals.forEach(v=>{
    const b=computeBinIndex(brks,v);
    if(b>=0&&b<hist.length) hist[b]++; 
  });
  const maxH=Math.max(...hist,1);
  el.insertAdjacentHTML('beforeend',
    `<div class="histogram">${hist.map(c=>`<div class="hist-bar" style="height:${Math.max(2,Math.round(c/maxH*20))}px" title="${nf(c)} cells"></div>`).join('')}</div>`
  );

  for(let i=0;i<n;i++){
    const a=brks[i], b=brks[i+1], iso=(isolatedBin===i)?' isolated':'';
    el.insertAdjacentHTML('beforeend',
      `<div class="legend-row${iso}" data-bin="${i}" title="${nf(a)} – ${nf(b)}">
         <span class="swatch" style="background:${ramp[i]}"></span><span>${nf(a)} – ${nf(b)}</span>
       </div>`
    );
  }
  el.querySelectorAll('.legend-row[data-bin]').forEach(row=>{
    row.addEventListener('click', e=>{
      const bin=parseInt(e.currentTarget.dataset.bin,10);
      isolatedBin=(isolatedBin===bin)?-1:bin;
      buildLayer(); // rebuild with isolation
    });
  });
}

/* ========= Canonicalization ========= */
const canon = {
  season: v => {
    const s=(v??'').toString().toLowerCase().trim();
    if(!s) return 'Unknown';
    if(['outono','autumn','fall'].includes(s)) return 'Autumn';
    if(['primavera','spring'].includes(s)) return 'Spring';
    if(['verao','verão','summer'].includes(s)) return 'Summer';
    if(['inverno','winter'].includes(s)) return 'Winter';
    return 'Unknown';
  },
  sex: v => {
    const s=(v??'').toString().toLowerCase().trim();
    if(['fêmea','femea','female','f'].includes(s)) return 'Female';
    if(['macho','male','m'].includes(s)) return 'Male';
    return 'Unknown';
  },
  stage: v => {
    const s=(v??'').toString().toLowerCase().trim();
    if(['adulto','adult'].includes(s)) return 'Adult';
    if(['juvenil','juvenile'].includes(s)) return 'Juvenile';
    if(['filhote','hatchling'].includes(s)) return 'Hatchling';
    return 'Unknown';
  },
  year: v => {
    if(v==null) return '';
    const n=parseInt(String(v).replace(/\.0+$/,''),10);
    return Number.isFinite(n)?String(n):'';
  }
};
const asIntString=v=>{ const n=parseInt(v,10); return Number.isFinite(n)?String(n):String(v); };

/* ========= pmtiles:// fetch shim ========= */
const origFetch = window.fetch.bind(window);
const pmCache = new Map();
async function getPM(archive){
  const u=new URL(archive, new URL('.', location.href)).toString();
  if(pmCache.has(u)) return pmCache.get(u);
  const inst=new pmtiles.PMTiles(u);
  pmCache.set(u,inst);
  return inst;
}
window.fetch = async (input, init) => {
  if (typeof input === 'string' && input.startsWith('pmtiles://')) {
    const m = input.match(/^pmtiles:\/\/(.+?)\/(\d+)\/(\d+)\/(\d+)\.pbf$/);
    if (!m) return Promise.reject(new Error('Bad pmtiles URL'));
    const [_, archive, z, x, y] = m;
    try{
      const pm = await getPM(archive);
      const t  = await pm.getZxy(+z,+x,+y);
      if(!t || !t.data){ return new Response(null,{status:204}); }
      return new Response(t.data);
    }catch(e){
      console.warn('Tile fetch failed for', archive, z, x, y, e);
      return new Response(null,{status:204});
    }
  }
  return origFetch(input, init);
};

/* ========= Helpers ========= */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function lon2tile(lon,z){return Math.floor((lon+180)/360*Math.pow(2,z));}
function lat2tile(lat,z){const r=lat*Math.PI/180;return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*Math.pow(2,z));}
function tileRangeForBounds(b,z){
  const nw=b.getNorthWest(), se=b.getSouthEast();
  let minX=lon2tile(nw.lng,z), maxX=lon2tile(se.lng,z);
  let minY=lat2tile(nw.lat,z), maxY=lat2tile(se.lat,z);
  if(maxX<minX)[minX,maxX]=[maxX,minX]; if(maxY<minY)[maxY,minY]=[minY,maxY];
  const n=Math.pow(2,z); minY=Math.max(0,Math.min(n-1,minY)); maxY=Math.max(0,Math.min(n-1,maxY));
  return {minX,maxX,minY,maxY};
}
const wrapX=(x,z)=>{const n=Math.pow(2,z);return((x%n)+n)%n;};
function fileFor(res, ct){ const v='20250812'; return `hexgrid_${res}_${ct}.pmtiles?v=${v}`; }

/* ========= State ========= */
let vtLayer=null, layerNames=[], header=null;
const aggByHex=new Map();
let metricField='sum_val';
const stats = (window.ss || window.simpleStatistics || null);
let lastStyleFn=null; // for hover highlight

/* ========= Detect ALL layer names (more robust for r5 etc.) ========= */
async function detectLayerNames(pmFile){
  const names = new Set();
  try{
    const pm = await getPM(pmFile);
    header = await pm.getHeader();
    const md = await pm.getMetadata();
    if(md && md.json){
      const j=(typeof md.json==='string')?JSON.parse(md.json):md.json;
      if(j && j.vector_layers){
        if(Array.isArray(j.vector_layers)){
          j.vector_layers.forEach(vl=>{ if(vl && vl.id) names.add(vl.id); });
        }else{
          Object.keys(j.vector_layers).forEach(k=>names.add(k));
        }
      }
      if(names.size) return Array.from(names);
    }
    if(!window.__VT__ || !window.__PBF__) throw new Error('VectorTile/Pbf not available for probing');
    const zCandidates = Array.from(new Set([
      Math.floor(map.getZoom()),
      6, header.minZoom, header.maxZoom
    ].filter(n=>Number.isFinite(n)))).sort((a,b)=>a-b);
    for(const z0 of zCandidates){
      const z=clamp(z0, header.minZoom, header.maxZoom);
      const {minX,maxX,minY,maxY}=tileRangeForBounds(map.getBounds(), z);
      for(let x=minX;x<=maxX;x++){
        for(let y=minY;y<=maxY;y++){
          const r = await (await getPM(pmFile)).getZxy(z, wrapX(x,z), y);
          if(!r || !r.data) continue;
          const vt=new window.__VT__(new window.__PBF__(r.data));
          Object.keys(vt.layers||{}).forEach(k=>names.add(k));
        }
      }
      if(names.size) break;
    }
  }catch(e){ console.warn('Layer detect failed:', e); }
  if(!names.size){ console.warn('Falling back to ["hexgrid"]'); return ['hexgrid']; }
  return Array.from(names);
}

/* ========= Metric detection (strict) ========= */
const metricCandidatesByCT = {
  weight: ['sum_val','weight'],
  new_weight: ['sum_val','new_weight'],
  new_mortality_est_bf_mean: ['sum_val','new_mortality_est_bf_mean'],
  new_mortality_est_bf_low: ['sum_val','new_mortality_est_bf_low'],
  new_mortality_est_bf_high: ['sum_val','new_mortality_est_bf_high']
};
function chooseMetricFieldAcrossFeatures(observedPropsArr, ct){
  const priority = metricCandidatesByCT[ct] || ['sum_val'];
  for(const k of priority){
    let hits=0;
    for(const p of observedPropsArr){
      const v = Number(p[k]);
      if(Number.isFinite(v)){ hits++; if(hits>=3) return k; }
    }
  }
  for(const p of observedPropsArr){ if(Number.isFinite(Number(p.sum_val))) return 'sum_val'; }
  console.warn('[metric] Falling back to sum_val');
  return 'sum_val';
}

/* ========= Hex key (unified) ========= */
function hexKey(p){
  return p.h3_index ?? p.h3 ?? p.hex_id ?? p.index ?? p.id ?? null;
}

/* ========= Category helpers ========= */
function lowerPropMap(obj){ const out={}; for(const k in obj){ out[k.toLowerCase()]=obj[k]; } return out; }
function increment(mapObj, key, by){ if(!key) return; const k=String(key); mapObj[k]=(mapObj[k]||0)+(Number(by)||0); }
function pctParts(countMap){
  if(!countMap) return {parts:[], unknownCount:0, totalLabelled:0};
  const unknown = Number(countMap.Unknown || countMap.unknown || 0);
  const entries = Object.entries(countMap).filter(([k])=>k!=='Unknown'&&k!=='unknown');
  const totalLabelled = entries.reduce((s,[,v])=>s+(Number(v)||0),0);
  const pct = v => totalLabelled ? 100*(Number(v)||0)/totalLabelled : 0;
  return { parts: entries.map(([k,v])=>[k, pct(v)]), unknownCount: unknown, totalLabelled };
}

/* ========= Aggregation + stride-retry ========= */
const MAX_TILES_STATS=90;
const MAX_HEXES_STATS=1800;

async function aggregateAndCollect(pmFile, layerNames, predicate, ct){
  aggByHex.clear();
  const sums=[]; // always array
  try{
    if(!window.__VT__ || !window.__PBF__){
      showToast('Decoders not loaded (vector-tile/pbf).',4000,'warn');
      return sums;
    }
    const pm = await getPM(pmFile);
    const hdr = header || await pm.getHeader();
    const zView = Math.min(Math.max(6, hdr.minZoom), hdr.maxZoom);
    const {minX,maxX,minY,maxY} = tileRangeForBounds(map.getBounds(), zView);
    const tilesX=maxX-minX+1, tilesY=maxY-minY+1;
    const totalTiles=tilesX*tilesY;
    let stride=1;
    if(totalTiles>MAX_TILES_STATS){
      const factor=Math.ceil(Math.sqrt(totalTiles/MAX_TILES_STATS));
      stride=Math.max(1,factor);
    }

    let observedForMetric=[];

    const process = async (step)=>{
      const jobs=[];
      let cells=0;
      outer:
      for(let x=minX;x<=maxX;x+=step){
        for(let y=minY;y<=maxY;y+=step){
          jobs.push(pm.getZxy(zView, wrapX(x,zView), y).then(resp=>{
            if(!resp || !resp.data) return;
            const vt = new window.__VT__(new window.__PBF__(resp.data));
            const candidateLayers = layerNames && layerNames.length ? layerNames : Object.keys(vt.layers||{});
            for(const lname of candidateLayers){
              const lyr = vt.layers[lname]; if(!lyr) continue;
              for(let i=0;i<lyr.length;i++){
                const f = lyr.feature(i);
                const props = f.properties || {};
                const key = hexKey(props); if(!key) continue; // ensure hex layer
                if(!predicate(props)) continue;

                if(observedForMetric.length<16) observedForMetric.push(props);

                const entry = aggByHex.get(key) || {
                  sum:0,
                  maxUid: null, rowCount: 0,
                  sexCounts: Object.create(null),
                  stageCounts: Object.create(null),
                  seasonCounts: Object.create(null),
                  yearCounts: Object.create(null),
                  monthCounts: Object.create(null),
                  species: props.species || null
                };

                entry._vals = entry._vals || [];
                entry._vals.push(props);

                const l = lowerPropMap(props);
                const uidc = Number(l['uid_count'] ?? l['unique_ids'] ?? l['unique_turtle_ids'] ?? l['turtle_id_count']);
                if(Number.isFinite(uidc)){
                  entry.maxUid = (entry.maxUid==null)?uidc:Math.max(entry.maxUid, uidc);
                }else{
                  const rc = Number(props.count);
                  entry.rowCount += Number.isFinite(rc) ? rc : 1;
                }

                // Sex
                const sf = Number(l['sex_female']), sm = Number(l['sex_male']), su = Number(l['sex_unknown']);
                if(Number.isFinite(sf)||Number.isFinite(sm)||Number.isFinite(su)){
                  if(Number.isFinite(sf)) increment(entry.sexCounts,'Female',sf);
                  if(Number.isFinite(sm)) increment(entry.sexCounts,'Male',sm);
                  if(Number.isFinite(su)) increment(entry.sexCounts,'Unknown',su);
                }else if(l['sex']){
                  increment(entry.sexCounts, canon.sex(l['sex']), Number(props.count)||1);
                }
                // Stage
                const sad=Number(l['stage_adult']), sjv=Number(l['stage_juvenile']), sha=Number(l['stage_hatchling']), su2=Number(l['stage_unknown']);
                if(Number.isFinite(sad)||Number.isFinite(sjv)||Number.isFinite(sha)||Number.isFinite(su2)){
                  if(Number.isFinite(sad)) increment(entry.stageCounts,'Adult',sad);
                  if(Number.isFinite(sjv)) increment(entry.stageCounts,'Juvenile',sjv);
                  if(Number.isFinite(sha)) increment(entry.stageCounts,'Hatchling',sha);
                  if(Number.isFinite(su2)) increment(entry.stageCounts,'Unknown',su2);
                }else if(l['development_stage']||l['stage']){
                  increment(entry.stageCounts, canon.stage(l['development_stage']||l['stage']), Number(props.count)||1);
                }
                // Season
                const sao=Number(l['season_autumn']), ssp=Number(l['season_spring']), ssu=Number(l['season_summer']), swi=Number(l['season_winter']), sun=Number(l['season_unknown']);
                if(Number.isFinite(sao)||Number.isFinite(ssp)||Number.isFinite(ssu)||Number.isFinite(swi)||Number.isFinite(sun)){
                  if(Number.isFinite(sao)) increment(entry.seasonCounts,'Autumn',sao);
                  if(Number.isFinite(ssp)) increment(entry.seasonCounts,'Spring',ssp);
                  if(Number.isFinite(ssu)) increment(entry.seasonCounts,'Summer',ssu);
                  if(Number.isFinite(swi)) increment(entry.seasonCounts,'Winter',swi);
                  if(Number.isFinite(sun)) increment(entry.seasonCounts,'Unknown',sun);
                }else if(l['season']){
                  increment(entry.seasonCounts, canon.season(l['season']), Number(props.count)||1);
                }

                if(props.year!=null){
                  const y=canon.year(props.year); if(y) increment(entry.yearCounts,y, Number(props.count)||1);
                }
                if(props.month!=null){
                  const m=asIntString(props.month); if(m) increment(entry.monthCounts,m, Number(props.count)||1);
                }

                aggByHex.set(key,entry);
                cells++;
                if(cells>MAX_HEXES_STATS) break;
              }
            }
          }).catch(e=>console.warn('tile decode skipped',e)));
          if(aggByHex.size>MAX_HEXES_STATS) break outer;
        }
      }
      await Promise.allSettled(jobs);
      return cells;
    };

    let cells = await process(stride);
    if(cells===0 && stride>1){
      console.info('Stats retry with stride=1');
      cells = await process(1);
    }

    metricField = chooseMetricFieldAcrossFeatures(
      Array.from(aggByHex.values()).flatMap(e=>e._vals||[]).slice(0,36),
      ct
    );

    aggByHex.forEach((entry)=>{
      let sum=0;
      if(Array.isArray(entry._vals)){
        for(const p of entry._vals){
          const v=Number(p[metricField]);
          if(Number.isFinite(v)) sum+=v;
        }
      }
      entry.sum=sum;
      delete entry._vals;
    });

    aggByHex.forEach(v=>{ if(Number.isFinite(v.sum)) sums.push(v.sum); });

  }catch(e){
    console.warn('aggregateAndCollect failed', e);
    return [];
  }
  return sums;
}

/* ========= Breaks (robust) ========= */
const JENKS_CLASSES=5;
function manualQuantilesSorted(arr, probs){
  const n=arr.length-1;
  return probs.map(p=>{
    if(p<=0) return arr[0];
    if(p>=1) return arr[n];
    const idx = n*p;
    const lo = Math.floor(idx), hi=Math.ceil(idx);
    if(lo===hi) return arr[lo];
    const t = idx-lo;
    return arr[lo]*(1-t)+arr[hi]*t;
  });
}
function computeSafeBreaks(values){
  if(!Array.isArray(values)) return null;
  const sorted = values.filter(Number.isFinite).sort((a,b)=>a-b);
  if(sorted.length===0) return null;

  const min=sorted[0], max=sorted[sorted.length-1];
  if(min===max){
    const bump = (min===0)?1:Math.max(Math.abs(min)*0.1,1e-6);
    return [min-2*bump,min-bump,min,min+bump,min+2*bump,min+3*bump];
  }

  let edges=null;
  try{
    if(stats && typeof stats.jenks==='function' && sorted.length>=20){
      edges = stats.jenks(sorted, JENKS_CLASSES);
      const uniq = Array.from(new Set(edges.map(x=>+x.toFixed(10))));
      if(uniq.length<JENKS_CLASSES+1){
        const probs=[0,0.2,0.4,0.6,0.8,1];
        edges = stats.quantileSorted ? stats.quantileSorted(sorted, probs) : manualQuantilesSorted(sorted, probs);
      }
    }else{
      const probs=[0,0.2,0.4,0.6,0.8,1];
      edges = (stats && stats.quantileSorted) ? stats.quantileSorted(sorted, probs) : manualQuantilesSorted(sorted, probs);
    }
  }catch{
    const probs=[0,0.2,0.4,0.6,0.8,1];
    edges = (stats && stats.quantileSorted) ? stats.quantileSorted(sorted, probs) : manualQuantilesSorted(sorted, probs);
  }
  for(let i=1;i<edges.length;i++){ if(!(edges[i]>edges[i-1])) edges[i]=edges[i-1]+1e-9; }
  return edges;
}

/* ========= Style + popups ========= */
function makeStyle(localBreaks, localRamp){
  return (props)=>{
    const key = hexKey(props);
    const agg = key ? aggByHex.get(key) : undefined;
    const v = agg ? agg.sum : undefined;
    if(!Number.isFinite(v) && v!==0){ return {opacity:0, fillOpacity:0, interactive:false}; }
    const idx = computeBinIndex(localBreaks, v);
    if(isolatedBin>=0 && idx!==isolatedBin){ return {opacity:0, fillOpacity:0, interactive:false}; }
    const color = localRamp[Math.max(0,Math.min(idx, localRamp.length-1))] || localRamp[0];
    return {fill:true, fillColor:color, fillOpacity:0.65, color, weight:0.6, interactive:true};
  };
}

// Helpers for popup with symbols and percentages
function computePctMap(obj){
  const o=obj||{};
  const F=Number(o.Female||0), M=Number(o.Male||0), U=Number(o.Unknown||0);
  const totalLabelled = F+M;
  const pf = totalLabelled? (100*F/totalLabelled):0;
  const pm = totalLabelled? (100*M/totalLabelled):0;
  return {F, M, U, pf, pm};
}
function computePct4(obj, keys){
  const o=obj||{};
  let total=0; keys.forEach(k=>{ total += Number(o[k]||0); });
  const out={}; keys.forEach(k=>{
    const v=Number(o[k]||0); out[k]={v, p: total? (100*v/total):0};
  });
  const unknown=Number(o.Unknown||0);
  return {out, unknown};
}

let hoverLocked=false, highlightedId=null;
function bindHoverPopups(layer, styleFn){
  const keydown=(e)=>{ if(e.key==='Escape'){ hoverLocked=false; if(highlightedId!=null){ try{ layer.resetFeatureStyle(highlightedId);}catch{} highlightedId=null; } map.closePopup(); } };
  document.addEventListener('keydown',keydown);
  map.on('click',()=>{ if(!hoverLocked) map.closePopup(); });

  layer.on('mouseover', e=>{
    if(hoverLocked) return;
    const p = e.layer?.properties||{};
    const id = hexKey(p);
    if(id==null) return;
    const agg = aggByHex.get(id); if(!agg) return;

    // highlight this hex (same idea you liked earlier)
    try{
      const base = styleFn(p);
      layer.setFeatureStyle(id, Object.assign({}, base, {weight:2, color:'#111827', fillOpacity:Math.min(0.95,(base.fillOpacity||0.65)+0.1)}));
      highlightedId=id;
    }catch{}

    const sum = Number.isFinite(agg.sum)?agg.sum:0;
    const uid = (agg.maxUid!=null)?agg.maxUid:agg.rowCount;

    const sex = computePctMap(agg.sexCounts);
    const stage = computePct4(agg.stageCounts, ['Adult','Juvenile','Hatchling']);
    const season = computePct4(agg.seasonCounts, ['Autumn','Spring','Summer','Winter']);

    const years = agg.yearCounts||{};
    const months = agg.monthCounts||{};
    const topYear = Object.entries(years).sort((a,b)=> (b[1]||0)-(a[1]||0) || (Number(b[0]) - Number(a[0])) )[0]?.[0] ?? '–';
    const topYearC = years[topYear]||0;
    const topMonth = Object.entries(months).sort((a,b)=> (b[1]||0)-(a[1]||0) || (Number(b[0]) - Number(a[0])) )[0]?.[0] ?? '–';
    const topMonthC = months[topMonth]||0;

    const spSel=getCheckboxValues('speciesGroup');
    const spLabel=(spSel.length===1)?spSel[0]:(spSel.length>1?'Mixed':'All');

    const html = `
      <div style="min-width:280px">
        <div class="kv"><b>Species</b><span>${spLabel}</span></div>
        <div class="kv"><b>Sum (${metricField})</b><span>${nf(sum)}</span></div>
        <div class="kv"><b>Unique turtle IDs</b><span>${(agg.maxUid!=null)?nf(uid):nf(uid)+' (row-count fallback)'}</span></div>
        <hr/>
        <div class="kv"><b>Sex</b>
          <span style="font-size:11px">♀ ${nf(sex.F)} (${sex.pf.toFixed(1)}%) · ♂ ${nf(sex.M)} (${sex.pm.toFixed(1)}%) · Unknown ${nf(sex.U)}</span>
        </div>
        <div class="kv"><b>Stage</b>
          <span style="font-size:11px">Adult ${stage.out.Adult.p.toFixed(1)}% · Juvenile ${stage.out.Juvenile.p.toFixed(1)}% · Hatchling ${stage.out.Hatchling.p.toFixed(1)}% · Unknown ${nf(stage.unknown)}</span>
        </div>
        <div class="kv"><b>Season</b>
          <span style="font-size:11px">Aut ${season.out.Autumn.p.toFixed(1)}% · Spr ${season.out.Spring.p.toFixed(1)}% · Sum ${season.out.Summer.p.toFixed(1)}% · Win ${season.out.Winter.p.toFixed(1)}% · Unknown ${nf(season.unknown)}</span>
        </div>
        <div class="kv"><b>Top year</b><span>${topYear} (${nf(topYearC)})</span></div>
        <div class="kv"><b>Top month</b><span>${topMonth} (${nf(topMonthC)})</span></div>
        <hr/>
        <small class="muted">H3: ${id}</small>
      </div>`;
    L.popup({autoPan:false,offset:[0,-8]}).setLatLng(e.latlng).setContent(html).openOn(map);
  });
  layer.on('mouseout',()=>{
    if(hoverLocked) return;
    if(highlightedId!=null){ try{ layer.resetFeatureStyle(highlightedId);}catch{} highlightedId=null; }
    map.closePopup();
  });
  layer.on('click',()=>{ hoverLocked=!hoverLocked; });
  layer.on('remove',()=>document.removeEventListener('keydown',keydown));
}

/* ========= Build / Rebuild ========= */
function currentRamp(){
  const sp=getCheckboxValues('speciesGroup');
  return (sp.length===1 && ramps[sp[0]])?ramps[sp[0]]:ramps['multi'];
}

function makePredicate(){
  const sel={
    species: new Set(getCheckboxValues('speciesGroup')),
    development_stage: new Set(getCheckboxValues('stageGroup')),
    sex: new Set(getCheckboxValues('sexGroup')),
    Fishing: new Set(getCheckboxValues('fishingGroup')),
    Marine_Debris: new Set(getCheckboxValues('marineDebrisGroup')),
    Boat_collision: new Set(getCheckboxValues('boatGroup')),
    Dredging: new Set(getCheckboxValues('dredgingGroup')),
    Oil: new Set(getCheckboxValues('oilGroup')),
    Petrol: new Set(getCheckboxValues('petrolGroup')),
    season: new Set(getCheckboxValues('seasonGroup')),
    year: new Set(getMulti('yearFilter')),
    month: new Set(getMulti('monthFilter')),
    decomposition_code: new Set(getMulti('decompFilter'))
  };
  const test=(k,v)=>{
    const set=sel[k]; if(!set || !set.size) return true;
    let pv=v;
    if(k==='season') pv=canon.season(v);
    else if(k==='sex') pv=canon.sex(v);
    else if(k==='development_stage') pv=canon.stage(v);
    else if(k==='year') pv=canon.year(v);
    else if(k==='month' || k==='decomposition_code') pv=asIntString(v);
    return set.has(pv);
  };
  return p=>( // include only features with a key to avoid non-hex layers
    hexKey(p)!=null &&
    test('species',p.species) &&
    test('development_stage',p.development_stage) &&
    test('sex',p.sex) &&
    test('Fishing',p.Fishing) &&
    test('Marine_Debris',p.Marine_Debris) &&
    test('Boat_collision',p.Boat_collision) &&
    test('Dredging',p.Dredging) &&
    test('Oil',p.Oil) &&
    test('Petrol',p.Petrol) &&
    test('season',p.season) &&
    test('year',p.year) &&
    test('month',p.month) &&
    test('decomposition_code',p.decomposition_code)
  );
}

async function buildLayer(){
  showSpinner('Loading & aggregating…');
  try{
    const res=$('resolution').value, ct=$('counttype').value;
    const pmFile=fileFor(res, ct);
    layerNames = await detectLayerNames(pmFile); // robust: style all found layers

    const predicate = makePredicate();
    const values = await aggregateAndCollect(pmFile, layerNames, predicate, ct); // ALWAYS array

    const finiteVals = values.filter(Number.isFinite);
    if(finiteVals.length===0){
      showToast('No data in view — zoom out or change filters.', 4000, 'info');
      hideSpinner();
      return;
    }

    const edges = computeSafeBreaks(finiteVals);
    if(!Array.isArray(edges) || edges.length<2){
      showToast('Could not compute breaks (fallback prevented). Keeping previous layer.', 4500, 'warn');
      hideSpinner();
      return;
    }

    activeRamp=currentRamp();
    updateLegend(edges, activeRamp, finiteVals);

    // build style mapping for ALL detected layers
    lastStyleFn = makeStyle(edges, activeRamp);
    const styleMap = {};
    layerNames.forEach(n=> styleMap[n]=lastStyleFn );

    if(vtLayer){ map.removeLayer(vtLayer); vtLayer=null; }
    vtLayer = L.vectorGrid.protobuf(`pmtiles://${pmFile}/{z}/{x}/{y}.pbf`,{
      rendererFactory: L.canvas.tile,
      vectorTileLayerStyles: styleMap,
      interactive:true,
      getFeatureId: f => hexKey(f.properties || {}) // unified
    });
    bindHoverPopups(vtLayer, lastStyleFn);
    vtLayer.addTo(map);
  }catch(err){
    console.error('buildLayer error:', err);
    showToast('Failed to load layer. See console for details.',5000,'error');
  }finally{
    hideSpinner();
  }
}

/* ========= Controls ========= */
$('applyBtn').addEventListener('click',()=>buildLayer());
$('resolution').addEventListener('change',()=>buildLayer());
$('counttype').addEventListener('change',()=>buildLayer());
$('resetBtn').addEventListener('click',()=>{
  document.querySelectorAll('.checkbox-group').forEach(g=>{
    const all=g.querySelector('.all input'); if(all){ all.checked=true; }
    g.querySelectorAll(':scope input:not(.all input)').forEach(cb=>cb.checked=false);
  });
  document.querySelectorAll('#panel select').forEach(s=>{
    if(s.multiple){
      Array.from(s.options).forEach(o=>o.selected=false);
      const all = Array.from(s.options).find(o=>o.value==='__ALL__'); if(all) all.selected=true;
    }else s.selectedIndex=0;
  });
  isolatedBin=-1;
  buildLayer();
});

/* ========= Permalink ========= */
function writeStateToHash(){
  const h=new URLSearchParams(), c=map.getCenter();
  h.set('z',map.getZoom().toFixed(2)); h.set('lat',c.lat.toFixed(6)); h.set('lng',c.lng.toFixed(6));
  h.set('res',$('resolution').value); h.set('ct',$('counttype').value);
  const groups={
    sp:'speciesGroup', st:'stageGroup', sx:'sexGroup', fish:'fishingGroup', debris:'marineDebrisGroup',
    boat:'boatGroup', dredge:'dredgingGroup', oil:'oilGroup', petrol:'petrolGroup', season:'seasonGroup'
  };
  Object.entries(groups).forEach(([key, gid])=>{
    const vals=getCheckboxValues(gid);
    h.set(key, vals.length?vals.join('|'):'all');
  });
  const yearVals=getMulti('yearFilter'); if(yearVals.length) h.set('year',yearVals.join('|'));
  const monVals=getMulti('monthFilter'); if(monVals.length) h.set('month',monVals.join('|'));
  const decVals=getMulti('decompFilter'); if(decVals.length) h.set('decomp',decVals.join('|'));
  if(isolatedBin>=0) h.set('isolated',String(isolatedBin));
  location.hash=h.toString();
}
function readStateFromHash(){
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.has('z')&&h.has('lat')&&h.has('lng')) map.setView([+h.get('lat'),+h.get('lng')], +h.get('z'));
  if(h.has('res')) $('resolution').value=h.get('res');
  if(h.has('ct')) $('counttype').value=h.get('ct');

  const groups={
    sp:'speciesGroup', st:'stageGroup', sx:'sexGroup', fish:'fishingGroup', debris:'marineDebrisGroup',
    boat:'boatGroup', dredge:'dredgingGroup', oil:'oilGroup', petrol:'petrolGroup', season:'seasonGroup'
  };
  Object.entries(groups).forEach(([key,gid])=>{
    const val=h.get(key);
    if(!val) return;
    const g=$(gid);
    const all=g.querySelector('.all input');
    const rest=Array.from(g.querySelectorAll(':scope input:not(.all input)'));
    if(all) all.checked=false;
    rest.forEach(cb=>cb.checked=false);
    if(val==='all'){ if(all) all.checked=true; return; }
    const wanted=new Set(val.split('|'));
    rest.forEach(cb=>{
      const lbl=cb.labels?.[0]?.textContent?.trim();
      if(lbl && wanted.has(lbl)) cb.checked=true;
    });
    if(rest.every(cb=>!cb.checked) && all) all.checked=true;
  });

  const setMulti=(id,key)=>{
    if(!h.has(key)) return;
    const vals=new Set(h.get(key).split('|'));
    Array.from($(id).options).forEach(o=>o.selected=vals.has(o.value));
  };
  setMulti('yearFilter','year');
  setMulti('monthFilter','month');
  setMulti('decompFilter','decomp');

  isolatedBin = h.has('isolated') ? parseInt(h.get('isolated')) : -1;
}
$('permalink').addEventListener('click',async()=>{
  writeStateToHash();
  try{ await navigator.clipboard.writeText(location.href); showToast('Link copied to clipboard!',3000,'info'); }
  catch{ showToast('Link updated in address bar.',3000,'info'); }
});

/* ========= Boot ========= */
(function init(){
  if(location.hash){ try{ readStateFromHash(); }catch(e){ console.warn('Permalink parse failed',e); } }
  buildLayer();
})();
</script>
